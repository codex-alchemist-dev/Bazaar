# Override: run PostgreSQL 18 with pgvector instead of the default 19.
# Usage: docker compose -f compose.yaml -f compose.pg18.yaml up -d
# PostgreSQL 18 is the current stable major and stays supported for one release cycle after 19 GA.
# It uses its own data volume (bazaar-pgdata-pg18), so it never touches the PostgreSQL 19 data.
# Tag pgvector/pgvector:pg18 was confirmed on Docker Hub on 2026-10-30.
services:
  postgres:
    image: pgvector/pgvector:pg18
    volumes:
      - bazaar-pgdata-pg18:/var/lib/postgresql
