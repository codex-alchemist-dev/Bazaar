<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body,#ed{margin:0;height:100%;width:100%;overflow:hidden;background:#181825}</style>
<link rel="stylesheet" href="monaco/vs/editor/editor.main.css">
</head><body><div id="ed"></div>
<script src="monaco/vs/loader.js"></script>
<script>
// Spike S12 bridge: doc 57 section 4. Every message has type + seq (+ documentId).
const T0 = performance.now();
let inSeq = 0, outSeq = 0, claimed = new Set(), editor = null, diff = null;
const models = new Map(), versions = new Map();
// Transport shim: WebView2 (chrome.webview) or WebKitGTK (webkit.messageHandlers.bridge + __fromHost).
const post = m => { m.seq = ++outSeq; if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(m); else window.webkit.messageHandlers.bridge.postMessage(JSON.stringify(m)); };
window.__evalReply = (id, v) => post({ type: 'evalResult', id, value: v });
const err = (msg, extra) => post({ type: 'error', message: msg, ...extra });

window.MonacoEnvironment = { getWorkerUrl: () => 'monaco/vs/editor/editor.worker.js' };
require.config({ paths: { vs: 'monaco/vs' } });
require(['vs/editor/editor.main'], () => {
  editor = monaco.editor.create(document.getElementById('ed'), { automaticLayout: true, model: null, minimap: { enabled: false } });
  editor.onKeyDown(e => {
    const b = e.browserEvent, id = (b.ctrlKey ? 'Ctrl+' : '') + (b.altKey ? 'Alt+' : '') + (b.shiftKey ? 'Shift+' : '') + b.code;
    if (claimed.has(id)) { e.preventDefault(); e.stopPropagation(); post({ type: 'keyPressed', key: id, claimed: true }); }
  });
  editor.onDidChangeCursorSelection(e => post({ type: 'selection', documentId: curDoc(), line: e.selection.positionLineNumber, col: e.selection.positionColumn }));
  post({ type: 'ready', monaco: monaco.editor.getEditors ? '0.57.0' : '?', tReadyMs: performance.now() - T0 });
  requestAnimationFrame(() => requestAnimationFrame(() => post({ type: 'firstPaint', tMs: performance.now() - T0 })));
});
const curDoc = () => { const m = editor && editor.getModel(); return m ? m.uri.toString() : null; };

function handle(m) {
  if (typeof m.seq !== 'number' || m.seq <= inSeq) return err('stale or missing seq', { got: m.seq, last: inSeq });
  inSeq = m.seq;
  if (!editor) return err('not ready');
  switch (m.type) {
    case 'open': {
      let model = models.get(m.documentId);
      if (!model) { model = monaco.editor.createModel(m.content, m.language, monaco.Uri.parse('inmemory://' + m.documentId)); models.set(m.documentId, model); versions.set(m.documentId, 0);
        model.onDidChangeContent(() => { const v = (versions.get(m.documentId) || 0) + 1; versions.set(m.documentId, v); post({ type: 'changed', documentId: m.documentId, version: v, dirty: true }); }); }
      disposeDiff(); editor.getContainerDomNode().style.display = ''; editor.setModel(model); editor.layout(); break; }
    case 'close': { const model = models.get(m.documentId); if (model) { model.dispose(); models.delete(m.documentId); } break; }
    case 'setTheme': monaco.editor.defineTheme('athanor', m.theme); monaco.editor.setTheme('athanor'); break;
    case 'setReadOnly': editor.updateOptions({ readOnly: !!m.value }); break;
    case 'applyEdit': { const model = models.get(m.documentId); model.applyEdits([{ range: model.getFullModelRange(), text: m.text }]); break; }
    case 'focus': editor.focus(); break;
    case 'setClaimedKeys': claimed = new Set(m.keys); break;
    case 'showDiff': {
      editor.getContainerDomNode().style.display = 'none'; disposeDiff();
      const host = document.createElement('div'); host.id = 'diffhost'; host.style.cssText = 'position:absolute;inset:0'; document.body.appendChild(host);
      diff = monaco.editor.createDiffEditor(host, { automaticLayout: true, renderSideBySide: true });
      diff.setModel({ original: monaco.editor.createModel(m.original, m.language), modified: monaco.editor.createModel(m.modified, m.language) });
      diff.onDidUpdateDiff(() => post({ type: 'diffComputed', changes: diff.getLineChanges().length }));
      break; }
    case 'getText': post({ type: 'text', documentId: m.documentId, text: models.get(m.documentId).getValue() }); break;   // spike-only test hook
    case 'testStaleOut': { const save = outSeq; outSeq = 0; post({ type: 'staleProbe' }); outSeq = save; break; }       // spike-only: emits a stale seq to the host
    default: err('unknown type ' + m.type);
  }
}
function disposeDiff() { if (diff) { const mm = diff.getModel(); diff.dispose(); mm.original.dispose(); mm.modified.dispose(); diff = null; const h = document.getElementById('diffhost'); if (h) h.remove(); } }
const onHost = d => { try { handle(d); } catch (x) { err(String(x)); } };
if (window.chrome && window.chrome.webview) window.chrome.webview.addEventListener('message', e => onHost(e.data));
window.__fromHost = onHost;
window.__probe = () => ({
  bg: getComputedStyle(document.querySelector('.monaco-editor-background')).backgroundColor,
  claimed: [...claimed], diffEditor: !!document.querySelector('.monaco-diff-editor'),
  workers: typeof Worker, theme: editor ? 'ok' : null });
</script></body></html>
