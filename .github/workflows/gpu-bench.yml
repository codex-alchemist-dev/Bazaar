# GPU benchmark regression gate for the Constellation Vulkan bench
# (docs/design/constellation-bench-regression-gate.md).
#
# Runs ONLY on a self-hosted runner labelled `gpu`, and ONLY on a schedule or on demand.
# It never triggers on pull requests, so no untrusted fork code ever reaches that machine.
# Not a required check. Read-only token; no secrets.
#
# The baseline is tests/Bazaar.Constellation.Vulkan.BenchGate/baselines/<gpu-label>.csv, taken
# on the same GPU. With no baseline the job records the run as an artifact and passes; commit
# the artifact as the baseline to arm the gate.

name: GPU bench

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GPU_LABEL: pc-gpu

jobs:
  gpu-bench:
    name: GPU bench regression gate
    if: github.repository == 'codex-alchemist-dev/Bazaar'
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run the Vulkan bench
        shell: pwsh
        run: dotnet run -c Release --project tests/Bazaar.Constellation.Vulkan.Bench -- "$env:RUNNER_TEMP/bench.csv"

      - name: Compare with the baseline
        shell: pwsh
        run: |
          $baseline = "tests/Bazaar.Constellation.Vulkan.BenchGate/baselines/$env:GPU_LABEL.csv"
          if (Test-Path $baseline) {
            dotnet run -c Release --project tests/Bazaar.Constellation.Vulkan.BenchGate -- $baseline "$env:RUNNER_TEMP/bench.csv"
            exit $LASTEXITCODE
          }
          "No baseline at $baseline; recording only." | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-bench-csv
          path: ${{ runner.temp }}/bench.csv
