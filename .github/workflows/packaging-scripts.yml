# Runs the PowerShell tests for the packaging scripts (packaging/velopack). Only when packaging/ changes.
# The tests are dry-run only: they never call vpk, never sign and never upload.
# Runs on GitHub-hosted windows-latest (it has pwsh). It does not use the owner's PC runner, so it
# does not wait behind the PC's queue or stall while the PC is off.
# Not a required check, so a docs-only PR is never left waiting on it.

name: Packaging scripts

on:
  pull_request:
    paths:
      - 'packaging/velopack/**'
      - '.github/workflows/packaging-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/velopack/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  velopack-pack-script:
    name: Velopack pack script tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the pack script tests
        shell: pwsh
        run: ./packaging/velopack/test-pack-client.ps1
