# NuGet dependency submission for the GitHub dependency graph.
#
# GitHub's automatic dependency submission (job `submit-nuget`) restores every
# project, including the Android heads and bench projects. The hosted Linux runner
# has no Android workload, so that restore fails with NETSDK1147 and the job is red
# on every commit. This workflow replaces it: it restores every project except the
# Android ones, reads the resolved packages with `dotnet list package`, and submits
# one snapshot through the dependency submission API. No third-party action is used.
#
# Needs the repo setting switched over (Settings > Advanced Security > Dependency
# graph > Automatic dependency submission: off) so the automatic job stops running.
# This job is not a required check.

name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the dependency submission API needs write on contents

concurrency:
  group: dependency-submission-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit NuGet dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore every project except the Android ones
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps"
          # Android projects need the Android workload, which this runner does not have.
          find src tests -name '*.csproj' -not -iname '*Android*' -not -ipath '*Android*' | sort > "$RUNNER_TEMP/deps/projects.txt"
          count="$(wc -l < "$RUNNER_TEMP/deps/projects.txt")"
          if [ "$count" -lt 1 ]; then
            echo "::error::No projects found to submit."
            exit 1
          fi
          while IFS= read -r project; do
            dotnet restore "$project" -p:EnableWindowsTargeting=true --nologo -v:q
            dotnet list "$project" package --include-transitive --format json > "$RUNNER_TEMP/deps/$(echo "$project" | tr '/' '_').json"
          done < "$RUNNER_TEMP/deps/projects.txt"
          echo "Read packages from $count projects."

      - name: Build and submit the snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/deps" > "$RUNNER_TEMP/snapshot.json" <<'PY'
          import datetime, glob, json, os, sys
          deps = sys.argv[1]
          manifests = {}
          for path in sorted(glob.glob(os.path.join(deps, "*.json"))):
              with open(path) as f:
                  data = json.load(f)
              for project in data.get("projects", []):
                  name = os.path.relpath(project["path"], os.getcwd()) if os.path.isabs(project["path"]) else project["path"]
                  resolved = {}
                  for framework in project.get("frameworks", []):
                      for key, relationship in (("topLevelPackages", "direct"), ("transitivePackages", "indirect")):
                          for package in framework.get(key, []):
                              version = package.get("resolvedVersion")
                              if not version:
                                  continue
                              purl = "pkg:nuget/%s@%s" % (package["id"], version)
                              # A package seen as direct in any framework stays direct.
                              if purl in resolved and resolved[purl]["relationship"] == "direct":
                                  continue
                              resolved[purl] = {"package_url": purl, "relationship": relationship, "scope": "runtime"}
                  if resolved:
                      manifests[name] = {"name": name, "file": {"source_location": name}, "resolved": resolved}
          if not manifests:
              sys.exit("no resolved packages found")
          snapshot = {
              "version": 0,
              "sha": os.environ["COMMIT"],
              "ref": os.environ["REF"],
              "job": {"correlator": "dependency-submission-nuget", "id": os.environ["RUN_ID"]},
              "detector": {"name": "bazaar-nuget-submission", "version": "1.0.0", "url": "https://github.com/" + os.environ["REPO"]},
              "scanned": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "manifests": manifests,
          }
          json.dump(snapshot, sys.stdout)
          PY
          gh api --method POST "repos/$REPO/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json"
