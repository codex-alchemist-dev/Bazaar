name: install-clean-windows

# Runs scripts/install/install-windows.ps1 on a fresh hosted Windows runner (never the owner's PC). Builds or restores the packaged
# PostgreSQL 18 + pgvector bundle the same way postgres-bundle.yml does. Manual and nightly, plus runs when the script itself changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "52 3 * * *"
  push:
    branches: ['claude/project-thread-96ykqx']
    paths:
      - 'scripts/install/install-windows.ps1'
      - '.github/workflows/install-clean-windows.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the built PostgreSQL bundle
        id: bundle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/pg-bundle
          key: pg-bundle-windows-${{ hashFiles('packaging/postgres/versions.txt', 'packaging/postgres/build-pgvector-windows.ps1') }}

      - name: Load the MSVC build environment
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vcvars = & $vswhere -latest -products * -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvars64.bat not found' }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])" }
          }

      - name: Build the bundle
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/postgres/build-pgvector-windows.ps1 -OutDir artifacts/pg-bundle -Work "$env:RUNNER_TEMP\pg-bundle-work"

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install on a clean machine
        shell: pwsh
        run: ./scripts/install/install-windows.ps1 -Prefix "$env:RUNNER_TEMP\bazaar" -PgBundle artifacts/pg-bundle -Log "$env:RUNNER_TEMP\install.log"

      - name: Upload the install log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-log-windows
          path: ${{ runner.temp }}/install.log
