# CI for Bazaar. Runs on pull requests and on pushes to main only (a branch is built once, not twice).
# Docs-only PRs skip the heavy steps (see the `changes` job and docs/pr-flow.md). Runs on GitHub-hosted runners, except that required jobs go to the owner's self-hosted
# runners (labels bazaar-win, bazaar-linux, bazaar-linux-pg) when the run was started by the owner account
# (github.actor and triggering_actor are Cookiesmuch) and, for pull requests, the head branch is in this
# repository. Fork PRs and every other actor stay on hosted runners and never reach the owner's machine.
#
# Every third-party action is pinned to a full commit SHA; the version tag is
# kept in a trailing comment. Dependabot (github-actions ecosystem) proposes
# bumps for these pins. Do not switch to tags.
#
# Permissions: the workflow token is read-only. No job needs write access.
# Fork pull requests get no secrets, which is what we want: nothing here
# depends on a secret.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the first full run when a draft is marked ready (drafts skip every job below).
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue: the queue runs the full required set once on the merged result (a queue run is not a pull request,
  # so `changes` treats it like main and builds everything). Needs the "Protect main" ruleset to enable the queue.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    # Weekly run so the full-history secret scan also runs when no push happens (Mondays 03:17 UTC).
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  # A newer pull request update supersedes the older run for the same ref. Runs on main are never cancelled by a
  # later push, so each merge to main gets a full verification (a newer queued run only replaces an older *waiting* one).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the change touches code. Docs-only PRs skip the heavy work. The heavy jobs still run (a
  # skipped matrix job would report an unexpanded check name and leave the required check pending), so the
  # skip is done per step with `if: needs.changes.outputs.code == 'true'`. Pushes and non-PR events are code.
  changes:
    name: Detect code changes
    # Draft pull requests skip CI. A draft cannot merge, and marking it ready runs the full set once. Every other job
    # either needs this job (and is skipped with it) or carries the same condition. Pushes and manual runs are not drafts.
    if: github.event.pull_request.draft != true
    # The gate jobs (this one and Secret scan) run on the PC for the owner's own same-repo runs, so they never wait in the
    # hosted queue ahead of the work they route. CI_RUNNER_MODE=hosted puts them back on GitHub (use it if the PC is off).
    runs-on: ${{ fromJSON(github.actor == 'Cookiesmuch' && github.triggering_actor == 'Cookiesmuch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_MODE || 'idle') != 'hosted' && '["self-hosted","bazaar-linux-pg"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      all: ${{ steps.affected.outputs.all }}
      android: ${{ steps.affected.outputs.android }}
      linux_client: ${{ steps.affected.outputs.linux_client }}
      windows: ${{ steps.affected.outputs.windows }}
      projects: ${{ steps.affected.outputs.projects }}
      tests: ${{ steps.affected.outputs.tests }}
      linuxpg: ${{ steps.runners.outputs.linuxpg }}
      win: ${{ steps.runners.outputs.win }}
    steps:
      # Picks where the heavy jobs run. The repository is public, so GitHub-hosted runners are free; the owner's PC
      # (self-hosted labels) is used only for the owner's own same-repo runs, and only while it is not backed up.
      # Repository variable CI_RUNNER_MODE: hybrid (default: Linux legs on the PC, Windows on hosted), hosted (never the PC), auto (PC while not backed up), self (always the PC).
      # Repository variable CI_OVERFLOW_QUEUE (default 8): in auto mode, more queued runs than this sends the run to hosted.
      # Any error here falls back to hosted. This job and Secret scan always run hosted, so the cheap checks never queue
      # behind the PC. The job names of the required checks do not change.
      - name: Choose runners
        id: runners
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.CI_RUNNER_MODE || 'idle' }}
          RUNNERS_TOKEN: ${{ secrets.CI_RUNNERS_READ_TOKEN }}
          PC_WINDOWS: ${{ vars.CI_PC_WINDOWS || 'false' }}
          LIMIT: ${{ vars.CI_OVERFLOW_QUEUE || '8' }}
          OWNER_RUN: ${{ github.actor == 'Cookiesmuch' && github.triggering_actor == 'Cookiesmuch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set -uo pipefail
          hosted() {
            echo 'linuxpg="ubuntu-latest"' >> "$GITHUB_OUTPUT"
            echo 'win="windows-latest"' >> "$GITHUB_OUTPUT"
            echo "runners: hosted ($1)"
          }
          self() {
            echo 'linuxpg=["self-hosted","bazaar-linux-pg"]' >> "$GITHUB_OUTPUT"
            echo 'win=["self-hosted","bazaar-win"]' >> "$GITHUB_OUTPUT"
            echo "runners: self-hosted ($1)"
          }
          if [ "$OWNER_RUN" != "true" ] || [ "$MODE" = hosted ]; then hosted "not an owner run, or mode=hosted"; exit 0; fi
          if [ "$MODE" = self ]; then self "mode=self"; exit 0; fi
          # idle (the default): pick the pool that has a free runner right now. A job cannot race both pools, so each run
          # asks the GitHub API which PC runners are online and not busy at this moment: an idle PC runner means the job goes
          # to the PC, otherwise to GitHub. Windows goes to the PC only when repository variable CI_PC_WINDOWS is 'true'
          # (its workspaces need cleaning first). Listing runners needs repository administration read access, which the
          # workflow token does not have: add a fine-grained token (Administration: read, this repository only) as secret
          # CI_RUNNERS_READ_TOKEN. Without it, or on any API error, idle behaves like hybrid.
          if [ "$MODE" = idle ] && [ -n "${RUNNERS_TOKEN:-}" ]; then
            json="$(GH_TOKEN="$RUNNERS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" 2>/dev/null)" || json=""
            if [ -n "$json" ]; then
              idle() { printf '%s' "$json" | jq --arg l "$1" '[.runners[] | select(.status=="online" and .busy==false and ([.labels[].name] | index($l)))] | length'; }
              il="$(idle bazaar-linux-pg)"; iw="$(idle bazaar-win)"
              if [ "${il:-0}" -ge 1 ]; then echo 'linuxpg=["self-hosted","bazaar-linux-pg"]' >> "$GITHUB_OUTPUT"; l=PC; else echo 'linuxpg="ubuntu-latest"' >> "$GITHUB_OUTPUT"; l=hosted; fi
              if [ "${iw:-0}" -ge 1 ] && [ "$PC_WINDOWS" = true ]; then echo 'win=["self-hosted","bazaar-win"]' >> "$GITHUB_OUTPUT"; w=PC; else echo 'win="windows-latest"' >> "$GITHUB_OUTPUT"; w=hosted; fi
              echo "runners: idle PC runners linux=$il win=$iw (PC Windows allowed: $PC_WINDOWS); Linux on $l, Windows on $w (mode=idle)"
              exit 0
            fi
            echo "runners: could not list runners, using hybrid"
          fi
          if [ "$MODE" = hybrid ] || [ "$MODE" = idle ]; then
            echo 'linuxpg=["self-hosted","bazaar-linux-pg"]' >> "$GITHUB_OUTPUT"
            echo 'win="windows-latest"' >> "$GITHUB_OUTPUT"
            echo "runners: Linux on the PC, Windows hosted (mode=hybrid)"
            exit 0
          fi
          queued="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=1" --jq .total_count 2>/dev/null)" || queued=""
          case "$queued" in ''|*[!0-9]*) hosted "queue count unavailable"; exit 0;; esac
          if [ "$queued" -gt "$LIMIT" ]; then hosted "$queued runs queued, limit $LIMIT"; else self "$queued runs queued, limit $LIMIT"; fi

      - name: List changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any failure here means "treat as code": the heavy jobs then run instead of silently skipping.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')" || {
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Code is anything outside docs/, *.md and the issue templates. Workflow changes count as code.
          if printf '%s\n' "$files" | grep -Evq '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # Works out, from the project reference graph, which projects a pull request can affect (scripts/ci/affected.py).
      # Build and test then covers only those, and the Android and Linux start-up jobs skip when their head cannot be
      # affected. Anything unclear (a shared file, a file outside every project, an API error) means "all". Pushes to
      # main, manual and scheduled runs always run everything.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find affected projects
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          everything() { printf 'all=true\nandroid=true\nlinux_client=true\nwindows=true\nprojects=\ntests=\n' >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = "pull_request" ] || everything
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt" || everything
          [ -s "$RUNNER_TEMP/files.txt" ] || everything
          [ "$(wc -l < "$RUNNER_TEMP/files.txt")" -lt 3000 ] || everything
          python3 scripts/ci/affected.py "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/affected.txt" || everything
          cat "$RUNNER_TEMP/affected.txt"
          cat "$RUNNER_TEMP/affected.txt" >> "$GITHUB_OUTPUT"

  # No paths filter on purpose, here or on the workflow trigger: the required checks always report.
  # Docs-only PRs skip the work step by step (`changes` job); do not add a paths-ignore. See docs/pr-flow.md.
  build-test:
    name: Build and test (${{ matrix.os }})
    # The Windows leg of a pull request only does work when a Windows-specific project can be affected (affected.py);
    # otherwise it skips every step on a cheap Ubuntu runner and still reports the required check. main runs it always.
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && (needs.changes.outputs.windows == 'true' && needs.changes.outputs.win || '"ubuntu-latest"') || needs.changes.outputs.linuxpg) }}
    needs: changes
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK version comes from global.json at the repo root (.NET 11, pinned).
      - name: Set up .NET SDK from global.json
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true')
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # hashFiles() walks the whole workspace and timed out (120 s) on the loaded PC runners. Hash only the tracked
      # files that matter, listed by git.
      - name: Compute NuGet cache key (Linux)
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && runner.os != 'Windows'
        id: nugetkey
        shell: bash
        run: |
          set -euo pipefail
          hash="$(git ls-files -- 'global.json' '*Directory.Packages.props' '*.csproj' '*packages.lock.json' | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # The Windows self-hosted runners have no bash on PATH, so this leg uses PowerShell 7 (pwsh; Windows PowerShell is blocked by the execution policy).
      - name: Compute NuGet cache key (Windows)
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && runner.os == 'Windows'
        id: nugetkey-win
        shell: pwsh
        run: |
          $files = git ls-files -- 'global.json' '*Directory.Packages.props' '*.csproj' '*packages.lock.json' | Sort-Object
          $parts = $files | ForEach-Object { "$_ " + (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($parts -join "`n"))
          $hash = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache NuGet packages
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ steps.nugetkey.outputs.hash || steps.nugetkey-win.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Real PostgreSQL for tests that touch SQL (no in-memory substitute). Linux only: hosted
      # Windows runners cannot run Linux containers. Tests read the connection string from BAZAAR_TEST_PG.
      - name: Start PostgreSQL 18 with pgvector (Linux)
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && (runner.os == 'Linux')
        run: |
          set -euo pipefail
          PG_NAME=bazaar-pg-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index || github.job }}
          # Throwaway test database: data on tmpfs and no fsync, so a loaded runner does not time out on disk I/O.
          docker run -d --name "$PG_NAME" -e POSTGRES_PASSWORD=bazaar -p 127.0.0.1::5432 \
            --tmpfs /var/lib/postgresql:rw,size=4g \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30 \
            pgvector/pgvector:pg18 -c max_locks_per_transaction=512 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG_NAME")" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG_NAME")" = healthy ]
          PG_PORT="$(docker port "$PG_NAME" 5432/tcp | head -n1 | sed 's/.*://')"
          echo "BAZAAR_TEST_PG=Host=127.0.0.1;Port=${PG_PORT};Username=postgres;Password=bazaar" >> "$GITHUB_ENV"
          echo "PG_NAME=$PG_NAME" >> "$GITHUB_ENV"

      - name: Build and test (Linux)
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && (runner.os == 'Linux')
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          # Pull requests build and test only the affected projects; main and unclear cases run everything.
          if [ "$ALL" = "false" ]; then scripts/ci/build-affected.sh "$PROJECTS" "$TESTS"; else ./build.sh; fi

      - name: Build and test (Windows)
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && (runner.os == 'Windows')
        shell: pwsh
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          if ($env:ALL -eq 'false') { ./scripts/ci/build-affected.ps1 -Projects $env:PROJECTS -Tests $env:TESTS } else { ./build.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Test output is only kept when the run fails, to keep artifact storage small.
      - name: Remove the PostgreSQL container
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && (always() && env.PG_NAME != '')
        run: docker rm -f "$PG_NAME" >/dev/null 2>&1 || true

      - name: Upload test results on failure
        if: needs.changes.outputs.code == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true') && (failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**
            **/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # Build gate for the Android head (doc 29, WP1). Builds the signed-free Release
  # project with BazaarAndroid=true on every PR, so the head cannot rot between
  # releases. The release workflow still produces the APK; this job only builds.
  build-android:
    name: Build Android head
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when no project the Android head or its gate depends on changed (scripts/ci/affected.py).
    if: needs.changes.outputs.android == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install .NET Android workload
        if: needs.changes.outputs.code == 'true'
        run: dotnet workload install android

      - name: Build Android head (Release)
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          dotnet build src/Bazaar.Client.Android/Bazaar.Client.Android.csproj \
            -c Release -p:BazaarAndroid=true

      # Accessibility gate on Android (doc 49 section 2). The desktop gate cannot construct the Android views, so the
      # gate app runs the same AccessibleControlScan on an emulator. Build only here; the emulator step installs it.
      - name: Build Android accessibility gate (Release)
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          dotnet build tests/Bazaar.Client.Android.Gate.Tests/Bazaar.Client.Android.Gate.Tests.csproj \
            -c Release -p:BazaarAndroid=true

      - name: Enable KVM for the emulator
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the gate app on an API 35 x86_64 emulator (the head's minimum, SupportedOSPlatformVersion 35) and fails
      # unless the app logs RESULT=PASS. The script installs the app with dotnet build -t:Install.
      # Inline emulator steps: no third-party action to pin (doc 49 section 2, supply chain).
      - name: Install Android emulator and system image
        if: needs.changes.outputs.code == 'true'
        run: |
          # No pipefail here: `yes |` gets SIGPIPE once sdkmanager stops reading, which is expected.
          set -eu
          # The runner image does not put cmdline-tools on PATH, so call the SDK tools by full path.
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?no Android SDK on this runner}}"
          tools="$sdk/cmdline-tools/latest/bin"
          test -x "$tools/sdkmanager" || { echo "cmdline-tools not found under $sdk"; exit 1; }
          yes | "$tools/sdkmanager" --licenses >/dev/null
          "$tools/sdkmanager" --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          # Pin the AVD location. Run 43770749823 created the AVD where the emulator does not look ("Unknown AVD name [ci]").
          avd_home="$RUNNER_TEMP/avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo "no" | "$tools/avdmanager" create avd -n ci -k "system-images;android-35;google_apis;x86_64" -d pixel_6 \
            -p "$avd_home/ci.avd" --force
          "$tools/avdmanager" list avd | grep -q 'Name: ci' || { echo "AVD ci was not created in $avd_home"; exit 1; }
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          echo "$tools" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"

      - name: Start emulator
        if: needs.changes.outputs.code == 'true'
        run: |
          set -eu
          nohup "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Run Android accessibility gate on emulator
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/ci/android-a11y-gate.sh

  # Start-up gate for the Linux head (doc 30, testing). The headless tests cannot see a client that aborts on a real
  # display, so this starts the built client on Xvfb. Runs on every PR (no path filter, see the note above build-test).
  linux-client-startup:
    name: Linux client start-up (Xvfb)
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when no project the Linux head depends on changed (scripts/ci/affected.py).
    if: needs.changes.outputs.linux_client == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # hashFiles() walks the whole workspace and timed out (120 s) on the loaded PC runners. Hash only the tracked
      # files that matter, listed by git.
      - name: Compute NuGet cache key
        if: needs.changes.outputs.code == 'true'
        id: nugetkey
        shell: bash
        run: |
          set -euo pipefail
          hash="$(git ls-files -- 'global.json' '*Directory.Packages.props' '*.csproj' '*packages.lock.json' | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ steps.nugetkey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Xvfb
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Start the Linux client on Xvfb
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/ci/linux-client-startup.sh

      - name: Build the tarball, start it on Xvfb and test signing
        run: |
          set -euo pipefail
          bash packaging/linux/build-tarball.sh --verify
          bash packaging/linux/test-sign-tarball.sh

  secret-scan:
    name: Secret scan (full history)
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(github.actor == 'Cookiesmuch' && github.triggering_actor == 'Cookiesmuch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_MODE || 'idle') != 'hosted' && '["self-hosted","bazaar-linux-pg"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned gitleaks CLI release (MIT). Binary checksum is checked before it runs.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Why the CLI and not gitleaks/gitleaks-action:
      # gitleaks-action v2 needs a GITLEAKS_LICENSE secret for organisation-owned
      # repositories (this repo is under the codex-alchemist-dev org). The key is
      # issued through a sign-up form and the action itself is under a
      # custom licence, not an OSI open-source one. The gitleaks CLI is MIT
      # licensed and needs no key, so we download the pinned release, verify its
      # SHA-256 and run it directly. See the scan step for what each trigger scans.
      - name: Install gitleaks CLI (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan git history for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A pull request scans only its own commits (base..head), so another branch's fake token cannot turn this
          # PR red. Pushes, the weekly schedule and manual runs scan every ref in the fetched history, so nothing
          # stays unscanned. --exit-code 1 fails the job on any finding. --redact keeps secret values out of logs.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            range="--all"
          fi
          echo "gitleaks scope: $range"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --exit-code 1 --verbose .

# CodeQL analysis trigger (no functional change).

  # PostgreSQL 19 RC leg (#491 step 1). Its own job so the required check names above do not change.
  # Not required until PostgreSQL 19 is GA; then drop continue-on-error and add it to branch protection.
  build-test-pg19:
    name: Build and test (Linux, PostgreSQL 19 RC)
    runs-on: ${{ fromJSON(needs.changes.outputs.linuxpg) }}
    needs: changes
    timeout-minutes: 45
    continue-on-error: true
    # Not required, so it runs only on main and by hand, not on every PR or branch push. This frees the
    # three bazaar-linux-pg runners for the required checks. PostgreSQL 18 still runs on every PR.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # hashFiles() walks the whole workspace and timed out (120 s) on the loaded PC runners. Hash only the tracked
      # files that matter, listed by git.
      - name: Compute NuGet cache key
        if: needs.changes.outputs.code == 'true'
        id: nugetkey
        shell: bash
        run: |
          set -euo pipefail
          hash="$(git ls-files -- 'global.json' '*Directory.Packages.props' '*.csproj' '*packages.lock.json' | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ steps.nugetkey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # PostgreSQL 19 RC with pgvector from PGDG, built from the same Dockerfile as the Compose image.
      # The RC base tag is set here; bump to the GA tag on 2026-11-19 or later.
      - name: Build and start PostgreSQL 19 RC with pgvector
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          PG_NAME=bazaar-pg-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index || github.job }}
          docker build -t bazaar-pg19:ci --build-arg PG_MAJOR=19 --build-arg PG_BASE=postgres:19rc1-bookworm packaging/postgres
          docker run -d --name "$PG_NAME" -e POSTGRES_PASSWORD=bazaar -p 127.0.0.1::5432 \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30 \
            bazaar-pg19:ci -c max_locks_per_transaction=512 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG_NAME")" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG_NAME")" = healthy ]
          PG_PORT="$(docker port "$PG_NAME" 5432/tcp | head -n1 | sed 's/.*://')"
          echo "BAZAAR_TEST_PG=Host=127.0.0.1;Port=${PG_PORT};Username=postgres;Password=bazaar" >> "$GITHUB_ENV"
          echo "PG_NAME=$PG_NAME" >> "$GITHUB_ENV"

      - name: Build and test (Linux, PostgreSQL 19 RC)
        if: needs.changes.outputs.code == 'true'
        run: ./build.sh

      - name: Remove the PostgreSQL container
        if: needs.changes.outputs.code == 'true' && (always() && env.PG_NAME != '')
        run: docker rm -f "$PG_NAME" >/dev/null 2>&1 || true

      - name: Upload test results on failure
        if: needs.changes.outputs.code == 'true' && (failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-pg19
          path: |
            **/TestResults/**
            **/*.trx
          if-no-files-found: ignore
