# CI for Bazaar. Runs on GitHub-hosted runners only (public repo: never self-hosted).
#
# Every third-party action is pinned to a full commit SHA; the version tag is
# kept in a trailing comment. Dependabot (github-actions ecosystem) proposes
# bumps for these pins. Do not switch to tags.
#
# Permissions: the workflow token is read-only. No job needs write access.
# Fork pull requests get no secrets, which is what we want: nothing here
# depends on a secret.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push or pull request update supersedes the older run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK version comes from global.json at the repo root (.NET 11, pinned).
      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Real PostgreSQL for tests that touch SQL (no in-memory substitute). Linux only: hosted
      # Windows runners cannot run Linux containers. Tests read the connection string from BAZAAR_TEST_PG.
      - name: Start PostgreSQL 18 with pgvector (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run -d --name bazaar-pg -e POSTGRES_PASSWORD=bazaar -p 5432:5432 \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30 \
            pgvector/pgvector:pg18
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bazaar-pg)" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' bazaar-pg)" = healthy ]
          echo "BAZAAR_TEST_PG=Host=localhost;Port=5432;Username=postgres;Password=bazaar" >> "$GITHUB_ENV"

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      # Test output is only kept when the run fails, to keep artifact storage small.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**
            **/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # Tracking job for the v0.3 exit check (tests/Bazaar.ExitCheck.Tests). It fails on purpose until the server pieces
  # listed in ExitCheckLedger.cs have merged, so it must not block merges. Remove continue-on-error (and move the
  # project into Bazaar.slnx) when the exit check passes; see that project's README.
  exit-check:
    name: v0.3 exit check (tracking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Start PostgreSQL 18 with pgvector
        run: |
          set -euo pipefail
          docker run -d --name bazaar-pg -e POSTGRES_PASSWORD=bazaar -p 5432:5432 \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30 \
            pgvector/pgvector:pg18
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bazaar-pg)" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' bazaar-pg)" = healthy ]
          echo "BAZAAR_TEST_PG=Host=localhost;Port=5432;Username=postgres;Password=bazaar" >> "$GITHUB_ENV"

      - name: Run the v0.3 exit check
        run: dotnet test --project tests/Bazaar.ExitCheck.Tests -c Release

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned gitleaks CLI release (MIT). Binary checksum is checked before it runs.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Why the CLI and not gitleaks/gitleaks-action:
      # gitleaks-action v2 needs a GITLEAKS_LICENSE secret for organisation-owned
      # repositories (this repo is under the codex-alchemist-dev org). The key is
      # issued through a sign-up form and the action itself is under a
      # custom licence, not an OSI open-source one. The gitleaks CLI is MIT
      # licensed and needs no key, so we download the pinned release, verify its
      # SHA-256 and run it directly. Scans all refs and full history.
      - name: Install gitleaks CLI (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          # --log-opts=--all scans every ref in the fetched history, not just HEAD.
          # --exit-code 1 fails the job on any finding. --redact keeps secret values out of logs.
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --exit-code 1 --verbose .
