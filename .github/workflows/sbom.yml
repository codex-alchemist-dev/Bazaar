# Software Bill of Materials (SBOM) for Bazaar releases.
#
# Generates a CycloneDX 1.6 JSON SBOM of the NuGet dependency graph for the
# solution and uploads it as the `sbom` artifact. It never touches the installer
# set: the artifact name is not installer-*, so release.yml verify keeps refusing
# it. release.yml verify downloads this artifact from the run for the tag commit
# and adds bazaar.cdx.json to the checksummed release set.
#
# Read-only: the default token is read-only and no secrets are used.
#
# Pins follow ci.yml and release.yml: every third-party action is a full commit SHA
# with the version tag in a trailing comment. The CycloneDX tool is pinned to an
# exact NuGet version.

name: SBOM

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      # Exact NuGet version of the CycloneDX .NET tool (package id CycloneDX).
      CYCLONEDX_VERSION: '6.3.1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install CycloneDX tool
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX --version "$CYCLONEDX_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate SBOM for the solution
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to produce an empty SBOM: the repo must contain exactly one solution
          # at the root. The repo uses the .slnx format (Bazaar.slnx); .sln is accepted too.
          mapfile -t solutions < <(find . -maxdepth 1 \( -name '*.sln' -o -name '*.slnx' \) | sort)
          if [ "${#solutions[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .sln or .slnx at the repository root, found ${#solutions[@]}."
            exit 1
          fi
          mkdir -p sbom
          dotnet CycloneDX "${solutions[0]}" \
            --output sbom \
            --json \
            --spec-version 1.6 \
            --exclude-dev \
            --filename bazaar.cdx.json
          # The SBOM must list at least one component, or the generation is treated as failed.
          components="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("components", [])))' sbom/bazaar.cdx.json)"
          if [ "$components" -lt 1 ]; then
            echo "::error::SBOM has no components."
            exit 1
          fi
          cd sbom
          sha256sum -- bazaar.cdx.json > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          echo "SBOM lists $components components."

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 30
