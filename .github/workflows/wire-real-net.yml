# Real-network tests for the wire transports (doc 90, section 10). They need MsQuic, which Windows ships, so they run
# only on the owner's self-hosted Windows runners (label bazaar-win, win-1 to win-4), never on hosted runners. The job
# does not run for forks or for any actor other than the owner, so it never reaches the owner's machine from outside.
# It is not a required check: it reports the behaviour the always-on in-memory tests cannot (real QUIC streams, close
# codes, certificate pinning, keep-alive).
#
# Every third-party action is pinned to a full commit SHA, as in ci.yml.

name: Wire real-network tests

on:
  pull_request:
    paths:
      - 'src/Bazaar.Wire.**'
      - 'src/Bazaar.Server.Transport.**'
      - 'src/Bazaar.Client.Transport.**'
      - 'tests/Bazaar.Wire.**'
      - 'tests/Bazaar.Transport.**'
      - 'tools/Bazaar.Wire.Bench**'
      - '.github/workflows/wire-real-net.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-net:
    name: Wire real-network tests (Windows, MsQuic)
    # No hosted fallback: when the guard is false the job is skipped and nothing is queued anywhere.
    if: github.actor == 'Cookiesmuch' && github.triggering_actor == 'Cookiesmuch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, bazaar-win]
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      BAZAAR_TEST_REAL_NET: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The Windows self-hosted runners have no bash on PATH, so this uses PowerShell 7.
      - name: Run the real-network wire tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(Get-ChildItem -Path 'tests/Bazaar.Wire.Transport.*.Tests', 'tests/Bazaar.Transport.*.Tests' -Directory -ErrorAction SilentlyContinue)
          if (-not $projects) { throw 'No wire transport test projects found.' }
          foreach ($p in $projects) {
            Write-Host "== $($p.Name)"
            dotnet test --project $p.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Tests failed in $($p.Name)" }
          }

      # Spike S-WTX (doc 90 section 10): the codec benchmark on the owner's PC runners, three process runs per row.
      # Results go to the job log and an artifact; transport rows join this step when the harness grows them.
      - name: Run the S-WTX codec benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/Bazaar.Wire.Bench --configuration Release -- --all --runs 3 --out "$env:RUNNER_TEMP/wire-bench.tsv" --md "$env:RUNNER_TEMP/wire-bench.md"
          if ($LASTEXITCODE -ne 0) { throw 'Wire benchmark failed' }
          Get-Content "$env:RUNNER_TEMP/wire-bench.md"

      - name: Upload the benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wire-bench-windows
          path: ${{ runner.temp }}/wire-bench.*
