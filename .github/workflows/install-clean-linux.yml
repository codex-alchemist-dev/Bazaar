name: install-clean-linux

# Runs scripts/install/install-linux.sh on a fresh hosted runner (doc 37, doc 03). Manual and nightly only: it is not a PR check.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install on a clean machine
        run: sudo -E scripts/install/install-linux.sh --log "$RUNNER_TEMP/install.log" --prefix /opt/bazaar
      - name: Upload the install log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-log
          path: ${{ runner.temp }}/install.log
