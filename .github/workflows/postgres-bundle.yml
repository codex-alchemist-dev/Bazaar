# Packaged PostgreSQL bundle check. Builds the PostgreSQL 18 + pgvector bundle that Bazaar.Server ships
# (packaging/postgres, versions.txt), then starts it the way the host does and runs every migration and a
# halfvec query against it. No external PostgreSQL is used on either platform.
#
# Pins: every third-party action is pinned to a full commit SHA, the same pins as ci.yml.

name: PostgreSQL bundle

on:
  pull_request:
    paths:
      - 'packaging/postgres/**'
      - 'src/Bazaar.Server/Data/**'
      - '.github/workflows/postgres-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/postgres/**'
      - 'src/Bazaar.Server/Data/**'
      - '.github/workflows/postgres-bundle.yml'
  workflow_dispatch:
    inputs:
      pgvector_version:
        description: 'pgvector version whose tag archive is hashed (#487)'
        required: true
        default: '0.8.7'
      pg19_binaries_url:
        description: 'EDB PostgreSQL 19 Windows binaries zip to hash on both runners (#491 step 2). Empty skips the job.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows-bundle:
    name: Windows bundle, start and migrate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PG_PORT: '54329'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the built bundle
        id: bundle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/pg-bundle
          key: pg-bundle-windows-${{ hashFiles('packaging/postgres/versions.txt', 'packaging/postgres/build-pgvector-windows.ps1') }}

      - name: Load the MSVC build environment
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vcvars = & $vswhere -latest -products * -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvars64.bat not found' }
          # Import the environment that vcvars64 sets (cl.exe, nmake, INCLUDE, LIB) into later steps.
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])" }
          }

      - name: Build the bundle (PostgreSQL binaries plus pgvector)
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/postgres/build-pgvector-windows.ps1 -OutDir artifacts/pg-bundle -Work "$env:RUNNER_TEMP\pg-bundle-work"

      - name: Check the bundle layout and pins (cached or freshly built)
        shell: pwsh
        run: ./packaging/postgres/test-bundle-layout.ps1 -BundleRoot artifacts/pg-bundle

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Start the bundled PostgreSQL the way the host does
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'artifacts\pg-bundle\18\bin'
          $data = Join-Path $env:RUNNER_TEMP 'pg-data'
          $pwFile = Join-Path $env:RUNNER_TEMP 'pg-pw.txt'
          Set-Content -Path $pwFile -Value 'ci-only-password' -NoNewline
          # Run a PostgreSQL tool with stdio redirected to files and a hard timeout. Piping its output into this
          # step (| Out-Host) kept the step open for the whole job: the server inherits the pipe and never closes it.
          function Invoke-PgTool([string]$Exe, [string[]]$Arguments, [string]$Name, [int]$TimeoutSeconds = 300) {
            $out = Join-Path $env:RUNNER_TEMP "$Name.out.txt"
            $err = Join-Path $env:RUNNER_TEMP "$Name.err.txt"
            $proc = Start-Process -FilePath $Exe -ArgumentList $Arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $proc.WaitForExit($TimeoutSeconds * 1000)) {
              $proc.Kill()
              Get-Content $out, $err -ErrorAction SilentlyContinue | Out-Host
              throw "$Name timed out after $TimeoutSeconds seconds"
            }
            Get-Content $out, $err -ErrorAction SilentlyContinue | Out-Host
            if ($proc.ExitCode -ne 0) { throw "$Name failed with exit code $($proc.ExitCode)" }
          }
          Invoke-PgTool (Join-Path $bin 'initdb.exe') @('-D', $data, '-U', 'postgres', '-A', 'scram-sha-256', "--pwfile=$pwFile", '--encoding=UTF8') 'initdb'
          # The host writes listen_addresses and the port itself; CI sets the same two values here.
          Add-Content -Path (Join-Path $data 'postgresql.conf') -Value "listen_addresses = '127.0.0.1'`nport = $env:PG_PORT"
          Invoke-PgTool (Join-Path $bin 'pg_ctl.exe') @('-D', $data, '-l', (Join-Path $env:RUNNER_TEMP 'pg.log'), '-w', 'start') 'pg_ctl_start' 120
          $env:PGPASSWORD = 'ci-only-password'
          & (Join-Path $bin 'psql.exe') -h 127.0.0.1 -p $env:PG_PORT -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE bazaar_ci" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'create database failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "BAZAAR_CI_DB=Host=127.0.0.1;Port=$env:PG_PORT;Database=bazaar_ci;Username=postgres;Password=ci-only-password"
          Add-Content -Path $env:GITHUB_ENV -Value "BAZAAR_CI_PGDATA=$data"

      - name: Run every migration and a halfvec query
        shell: pwsh
        run: |
          dotnet run --project src/Bazaar.Server.Host/Bazaar.Server.Host.csproj -- migrate `
            "--Bazaar:Host:DataRoot=$env:RUNNER_TEMP\bazaar-data" `
            "--Bazaar:Host:DatabaseConnectionReference=env:BAZAAR_CI_DB"
          if ($LASTEXITCODE -ne 0) { throw 'migrate failed' }
          $env:PGPASSWORD = 'ci-only-password'
          $bin = Join-Path $PWD 'artifacts\pg-bundle\18\bin'
          & (Join-Path $bin 'psql.exe') -h 127.0.0.1 -p $env:PG_PORT -U postgres -d bazaar_ci -v ON_ERROR_STOP=1 -At `
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'" `
            -c "SELECT '[1,2,3]'::halfvec(3)" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'halfvec check failed' }

      - name: Stop the bundled PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'artifacts\pg-bundle\18\bin'
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'pg-data')) {
            Start-Process -FilePath (Join-Path $bin 'pg_ctl.exe') -ArgumentList @('-D', (Join-Path $env:RUNNER_TEMP 'pg-data'), '-m', 'fast', '-w', 'stop') -NoNewWindow -Wait -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'pg_ctl_stop.out.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'pg_ctl_stop.err.txt')
          }

  linux-image:
    name: Linux Compose image, migrate and halfvec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the PostgreSQL 18 + pgvector image
        run: docker build -t bazaar-pg:ci packaging/postgres

      - name: Start the image and wait for it
        run: |
          docker run -d --name bazaar-pg -e POSTGRES_PASSWORD=ci-only-password -p 54330:5432 bazaar-pg:ci
          # The official image starts a temporary init server first, and pg_isready can pass against it before the
          # real server is up. Wait for a real query over TCP, which the init server does not accept.
          for _ in $(seq 1 60); do
            docker exec -e PGPASSWORD=ci-only-password bazaar-pg psql -h 127.0.0.1 -U postgres -At -c "select 1" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec -e PGPASSWORD=ci-only-password bazaar-pg psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE bazaar_ci"

      - name: Run every migration and a halfvec query
        env:
          BAZAAR_CI_DB: Host=127.0.0.1;Port=54330;Database=bazaar_ci;Username=postgres;Password=ci-only-password
        run: |
          dotnet run --project src/Bazaar.Server.Host/Bazaar.Server.Host.csproj -- migrate \
            --Bazaar:Host:DataRoot="$RUNNER_TEMP/bazaar-data" \
            --Bazaar:Host:DatabaseConnectionReference=env:BAZAAR_CI_DB
          docker exec -e PGPASSWORD=ci-only-password bazaar-pg psql -U postgres -d bazaar_ci -v ON_ERROR_STOP=1 -At \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'" \
            -c "SELECT '[1,2,3]'::halfvec(3)"

      - name: Stop the container
        if: always()
        run: docker rm -f bazaar-pg || true

  # Upgrade test, PostgreSQL 18 to 19 RC (#491 step 5). Dump and restore on the same data with a checksum.
  # Non-required until PostgreSQL 19 is GA.
  pg-upgrade:
    name: Upgrade 18 to 19 RC, dump and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the PostgreSQL 19 RC image
        run: docker build -t bazaar-pg19:ci --build-arg PG_MAJOR=19 --build-arg PG_BASE=postgres:19rc1-bookworm packaging/postgres

      - name: Dump on 18, restore on 19, compare checksums
        run: bash scripts/ci/pg-upgrade-dump-restore.sh pgvector/pgvector:pg18 bazaar-pg19:ci

  # pgvector 0.8.7 archive hash (#487). Downloads the tag archive on two different runner OSes and fails if the
  # SHA-256 differs, so a pin only goes into versions.txt when both agree. Also prints the tag's commit SHA so
  # the owner can compare it with the upstream release. Run it with workflow_dispatch.
  pgvector-sha256:
    name: pgvector ${{ inputs.pgvector_version }} archive hash (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Download the tag archive and hash it (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ inputs.pgvector_version }}
        run: |
          set -euo pipefail
          curl -sSL -o "pgvector-$VERSION.tar.gz" "https://github.com/pgvector/pgvector/archive/refs/tags/v$VERSION.tar.gz"
          HASH="$(sha256sum "pgvector-$VERSION.tar.gz" | cut -d' ' -f1)"
          echo "os=${RUNNER_OS} sha256=$HASH bytes=$(stat -c %s "pgvector-$VERSION.tar.gz")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag commit: $(git ls-remote https://github.com/pgvector/pgvector "refs/tags/v$VERSION^{}" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$HASH" > "hash-$RUNNER_OS.txt"

      - name: Upload the hash
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgvector-hash-${{ runner.os }}
          path: hash-${{ runner.os }}.txt

      - name: Download the tag archive and hash it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.pgvector_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $file = "pgvector-$env:VERSION.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/pgvector/pgvector/archive/refs/tags/v$env:VERSION.tar.gz" -OutFile $file -UseBasicParsing
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          $bytes = (Get-Item $file).Length
          "os=$env:RUNNER_OS sha256=$hash bytes=$bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "tag commit: $(git ls-remote https://github.com/pgvector/pgvector "refs/tags/v$env:VERSION^{}")" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $hash | Set-Content -Path "hash-$env:RUNNER_OS.txt" -NoNewline
      - name: Upload the hash (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgvector-hash-${{ runner.os }}
          path: hash-${{ runner.os }}.txt

  pgvector-sha256-compare:
    name: Compare pgvector archive hashes across OSes
    if: github.event_name == 'workflow_dispatch'
    needs: pgvector-sha256
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download both hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pgvector-hash-*
          path: hashes
          merge-multiple: true

      - name: Fail if the Linux and Windows runners disagree
        env:
          VERSION: ${{ inputs.pgvector_version }}
        run: |
          set -euo pipefail
          # Windows prints the digest in upper case; compare case-insensitively.
          L="$(tr -d '[:space:]' < hashes/hash-Linux.txt | tr '[:upper:]' '[:lower:]')"
          W="$(tr -d '[:space:]' < hashes/hash-Windows.txt | tr '[:upper:]' '[:lower:]')"
          echo "pgvector $VERSION: Linux=$L Windows=$W" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$L" = "$W" ] || { echo "hashes differ; do not pin" >&2; exit 1; }
          echo "Both runners agree. Check the tag commit against upstream before pinning PGVECTOR_SHA256 in packaging/postgres/versions.txt." | tee -a "$GITHUB_STEP_SUMMARY"

  # PostgreSQL 19 Windows binaries hash (#491 step 2). Fetches the EDB zip on Linux and Windows and prints the
  # SHA-256 from each, so the pin only goes in when both runners agree. Owner checks the URL and digest upstream.
  pg19-binaries-sha256:
    name: PostgreSQL 19 Windows binaries hash (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.pg19_binaries_url != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Fetch the zip and hash it (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          URL: ${{ inputs.pg19_binaries_url }}
        run: |
          set -uo pipefail
          curl -sSLf -o pg19.zip "$URL" || { echo "fetch failed for $URL" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "os=Linux sha256=$(sha256sum pg19.zip | cut -d' ' -f1) bytes=$(stat -c %s pg19.zip)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch the zip and hash it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          URL: ${{ inputs.pg19_binaries_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          try { Invoke-WebRequest -Uri $env:URL -OutFile pg19.zip -UseBasicParsing } catch { "fetch failed for $env:URL : $_" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append; throw }
          $h = (Get-FileHash pg19.zip -Algorithm SHA256).Hash
          "os=Windows sha256=$h bytes=$((Get-Item pg19.zip).Length)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
