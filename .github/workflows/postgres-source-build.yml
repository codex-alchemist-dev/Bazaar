# Source-compile pipeline for the packaged PostgreSQL bundle (doc 42 section 14.1, Q1 path a).
# Builds PostgreSQL from the pins in packaging/postgres/source/sources.txt, builds pgvector against it, checks the bundle
# layout and hashes, and runs a throwaway cluster on Linux (never a shared or system database).
#
# Line 18 jobs are required. The line 19 jobs use a release-candidate pin and are informational (continue-on-error)
# until PostgreSQL 19 is GA and the pgvector build against it passes. The research note marks pgvector on 19 as
# unverified; a passing 19 job is the gate for shipping a 19 bundle.
#
# Pins: every third-party action is pinned to a full commit SHA, the same pins as postgres-bundle.yml.

name: PostgreSQL source build

on:
  pull_request:
    paths:
      - 'packaging/postgres/**'
      - '.github/workflows/postgres-source-build.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/postgres/**'
      - '.github/workflows/postgres-source-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux source build, layout, throwaway cluster (PostgreSQL ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.major == '19' }}
    strategy:
      fail-fast: false
      matrix:
        major: ['18', '19']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex libssl-dev zlib1g-dev pkg-config postgresql-client

      - name: Build PostgreSQL and pgvector from source
        run: |
          packaging/postgres/source/build-from-source.sh --major "${{ matrix.major }}" \
            --out "$RUNNER_TEMP/pg-src-bundle" --work "$RUNNER_TEMP/pg-src-work"

      - name: Check the bundle layout, manifest and hashes
        run: |
          packaging/postgres/source/test-source-bundle.sh --bundle "$RUNNER_TEMP/pg-src-bundle/${{ matrix.major }}" \
            --major "${{ matrix.major }}" --platform linux

      - name: Start a throwaway cluster, create pgvector, run a halfvec query
        run: packaging/postgres/source/smoke-throwaway-cluster.sh --bundle "$RUNNER_TEMP/pg-src-bundle/${{ matrix.major }}"

      - name: Upload the bundle and its hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-src-bundle-linux-${{ matrix.major }}
          path: ${{ runner.temp }}/pg-src-bundle/${{ matrix.major }}
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows source build and layout (PostgreSQL ${{ matrix.major }})
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: ${{ matrix.major == '19' }}
    strategy:
      fail-fast: false
      matrix:
        major: ['18', '19']
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the MSVC build environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vcvars = & $vswhere -latest -products * -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvars64.bat not found' }
          # Import the environment that vcvars64 sets (cl.exe, nmake, INCLUDE, LIB) into later steps.
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])" }
          }

      - name: Install Meson and Ninja
        shell: pwsh
        run: python -m pip install --disable-pip-version-check meson ninja

      - name: Build PostgreSQL and pgvector from source
        shell: pwsh
        run: ./packaging/postgres/source/build-from-source-windows.ps1 -Major "${{ matrix.major }}" -OutDir "$env:RUNNER_TEMP\pg-src-bundle" -Work "$env:RUNNER_TEMP\pg-src-work"

      - name: Check the bundle layout, manifest and hashes
        shell: bash
        run: |
          packaging/postgres/source/test-source-bundle.sh --bundle "$RUNNER_TEMP/pg-src-bundle/${{ matrix.major }}" \
            --major "${{ matrix.major }}" --platform windows

      - name: Upload the bundle and its hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-src-bundle-windows-${{ matrix.major }}
          path: ${{ runner.temp }}\pg-src-bundle\${{ matrix.major }}
          if-no-files-found: error
          retention-days: 14
