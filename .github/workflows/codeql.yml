# CodeQL analysis (advanced setup). Runs on GitHub-hosted runners only.
#
# Why there is no paths filter: the required checks "Analyze (csharp)" and
# "Analyze (actions)" must report on every pull request. A paths filter would
# skip the workflow on docs-only changes, so the check would never appear and
# the PR could not merge. Do not add a `paths:` filter here.
#
# This file replaces CodeQL default setup. The two cannot coexist: the owner
# must switch Settings > Code security > Code scanning from default setup to
# advanced setup before this workflow can run. See docs/ci.md.
#
# Every third-party action is pinned to a full commit SHA; the version tag is
# kept in a trailing comment. Do not switch to tags.

name: CodeQL

on:
  push:
    # Every branch, like ci.yml. A push-triggered run is linked to its PR by branch name;
    # the pull_request-only run gets a refs/pull/N/head suite that GitHub does not link,
    # so the required Analyze checks would never count for the PR.
    branches: ['**']
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC: catches new queries against unchanged code.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push or pull request update supersedes the older run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change touches code. Docs-only PRs skip the heavy work. The heavy jobs still run (a
  # skipped matrix job would report an unexpanded check name and leave the required check pending), so the
  # skip is done per step with `if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)`. Pushes and non-PR events are code.
  changes:
    name: Detect code changes
    # A pull request from this repository is analysed by the push-triggered run of its branch (see the `on:` comment:
    # the pull_request-only suite is not linked to the PR). Skipping it here, and with it the analyze jobs that need it,
    # stops every PR being scanned twice. Fork pull requests still run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: List changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # A branch push: compare the pushed commit with main (the compare API lists up to 300 files).
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '[.files[].filename] | if length >= 300 then empty else .[] end')" || files=""
          elif [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
          # Any failure here means "treat as code": the heavy jobs then run instead of silently skipping.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')" || files=""
          fi
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Code is anything outside docs/, *.md and the issue templates. Workflow changes count as code.
          if printf '%s\n' "$files" | grep -Evq '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - name: Check out
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: C# is extracted from source without running a build, so
      # no .NET SDK or NuGet restore is needed here. The actions language has no
      # build step and also requires none. Accuracy for C# is lower than with a
      # real build; the trade-off is deliberate to keep the required check fast
      # and independent of the SDK version.
      - name: Initialize CodeQL
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
