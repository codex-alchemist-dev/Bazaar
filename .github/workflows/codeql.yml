# CodeQL analysis (advanced setup). Runs on GitHub-hosted runners only.
#
# Why there is no paths filter: the required checks "Analyze (csharp)" and
# "Analyze (actions)" must report on every pull request. A paths filter would
# skip the workflow on docs-only changes, so the check would never appear and
# the PR could not merge. Do not add a `paths:` filter here.
#
# This file replaces CodeQL default setup. The two cannot coexist: the owner
# must switch Settings > Code security > Code scanning from default setup to
# advanced setup before this workflow can run. See docs/ci.md.
#
# Every third-party action is pinned to a full commit SHA; the version tag is
# kept in a trailing comment. Do not switch to tags.

name: CodeQL

on:
  push:
    # Every branch, like ci.yml. A push-triggered run is linked to its PR by branch name;
    # the pull_request-only run gets a refs/pull/N/head suite that GitHub does not link,
    # so the required Analyze checks would never count for the PR.
    branches: ['**']
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC: catches new queries against unchanged code.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push or pull request update supersedes the older run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-csharp:
    name: Analyze (csharp)
    # TEMPORARY OWNER OVERRIDE (2026-11-22): pull requests and branch pushes are skipped at job level, so the required
    # checks pass without a runner. Scans still run on main, weekly, and by manual dispatch (docs/pr-flow.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      # Decides whether this language has anything to analyse. This job always runs and reports, so the required
      # check names never go missing; when nothing relevant changed the heavy steps are skipped and the job passes in
      # seconds. A skipped matrix job would report an unexpanded check name, so the skip is per step. Anything unclear
      # (an API error, no file list, 300 or more files, main, schedule, manual) means "analyse". There is no separate
      # detect job: that saved a job slot per push.
      - name: Decide whether to analyse
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          csharpUAGE: csharp
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          run() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "analyse: $1 ($2)"; exit 0; }
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '[.files[].filename] | if length >= 300 then empty else .[] end' 2>/dev/null)" || files=""
          elif [ "$EVENT" = "pull_request" ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' 2>/dev/null)" || files=""
          else
            run true "event $EVENT on $REF"
          fi
          [ -n "$files" ] || run true "no file list"
          if [ "$csharpUAGE" = "actions" ]; then
            pattern='^\.github/(workflows|actions)/'
          else
            pattern='(\.cs|\.csproj|\.props|\.targets|\.slnx|\.razor|\.axaml|\.xaml)$|^(global\.json|NuGet\.config)$'
          fi
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then run true "relevant files changed"; else run false "no $csharpUAGE files changed"; fi

      - name: Check out
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: C# is extracted from source without running a build, so
      # no .NET SDK or NuGet restore is needed here. The actions language has no
      # build step and also requires none. Accuracy for C# is lower than with a
      # real build; the trade-off is deliberate to keep the required check fast
      # and independent of the SDK version.
      - name: Initialize CodeQL
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:csharp

  analyze-actions:
    name: Analyze (actions)
    # TEMPORARY OWNER OVERRIDE (2026-11-22): pull requests and branch pushes are skipped at job level, so the required
    # checks pass without a runner. Scans still run on main, weekly, and by manual dispatch (docs/pr-flow.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      # Decides whether this language has anything to analyse. This job always runs and reports, so the required
      # check names never go missing; when nothing relevant changed the heavy steps are skipped and the job passes in
      # seconds. A skipped matrix job would report an unexpanded check name, so the skip is per step. Anything unclear
      # (an API error, no file list, 300 or more files, main, schedule, manual) means "analyse". There is no separate
      # detect job: that saved a job slot per push.
      - name: Decide whether to analyse
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          actionsUAGE: actions
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          run() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "analyse: $1 ($2)"; exit 0; }
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '[.files[].filename] | if length >= 300 then empty else .[] end' 2>/dev/null)" || files=""
          elif [ "$EVENT" = "pull_request" ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' 2>/dev/null)" || files=""
          else
            run true "event $EVENT on $REF"
          fi
          [ -n "$files" ] || run true "no file list"
          if [ "$actionsUAGE" = "actions" ]; then
            pattern='^\.github/(workflows|actions)/'
          else
            pattern='(\.cs|\.csproj|\.props|\.targets|\.slnx|\.razor|\.axaml|\.xaml)$|^(global\.json|NuGet\.config)$'
          fi
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then run true "relevant files changed"; else run false "no $actionsUAGE files changed"; fi

      - name: Check out
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: C# is extracted from source without running a build, so
      # no .NET SDK or NuGet restore is needed here. The actions language has no
      # build step and also requires none. Accuracy for C# is lower than with a
      # real build; the trade-off is deliberate to keep the required check fast
      # and independent of the SDK version.
      - name: Initialize CodeQL
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions
