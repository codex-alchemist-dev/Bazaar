# gitleaks settings for this repo. Extends the default rule set.
title = "Bazaar gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Fake secret-shaped literals used as SoulGuard negative and positive test inputs"
# 7581e7a added tests/Bazaar.Server.Tests/Memory/Notes/SoulGuardTests.cs. Its InlineData strings are fake
# examples that the SoulGuard scanner must reject. The commit is already pushed, so history is not rewritten.
# 44e954f (#141) added SoulGuardTests.cs with one fake GCP-shaped InlineData literal. Same scope as above: this commit only.
# d07f48d (WP14-8) added Base32Tests.cs with one fake Base32 input literal. Same scope as above: this commit only.
# 8fbd6b6c5 and 01ef61d92 each re-added the same fake GCP-shaped SoulGuard literal in SoulGuardTests.cs (#210 and later).
# Same scope: these commits only, and the literal is not a credential.
commits = ["7581e7afbc85c4d40539c8d498d28037e7ab3225", "44e954f9236cf12958dd88cfd6f2dd3eb06ac38b", "d07f48d27b58255c57171db7caad5e81b363ca8c", "8fbd6b6c5080e4bcaa02a9ee182562946ab42de2", "01ef61d92c2a37bf705546d84afbb86d73b66a95"]
# Base32Tests.cs holds fake Base32 test vectors (for example JBSWY3DP1SECRET), not credentials.
# Path-scoped, so later edits to this file do not need new commit entries.
paths = ['''tests/Bazaar\.Server\.Tests/Identity/Totp/Base32Tests\.cs$''']
