# examples that the SoulGuard scanner must reject. The commit is already pushed, so history is not rewritten.
# 44e954f (#141) added SoulGuardTests.cs with one fake GCP-shaped InlineData literal. Same scope as above: this commit only.
# d07f48d (WP14-8) added Base32Tests.cs with one fake Base32 input literal. Same scope as above: this commit only.
# 8fbd6b6c5 and 01ef61d92 each re-added the same fake GCP-shaped SoulGuard literal in SoulGuardTests.cs (#210 and later).
# Same scope: these commits only, and the literal is not a credential.
commits = ["7581e7afbc85c4d40539c8d498d28037e7ab3225", "44e954f9236cf12958dd88cfd6f2dd3eb06ac38b", "d07f48d27b58255c57171db7caad5e81b363ca8c", "8fbd6b6c5080e4bcaa02a9ee182562946ab42de2", "01ef61d92c2a37bf705546d84afbb86d73b66a95", "9ce11f1a3d05a73c4fbe04c7a17aa6f6e82c54b8", "9a3e33645c784275973aa2f14eca08dd8b5a4409", "2977bbd20d214716bac00de06bbb4e02a2709565", "525c4ef7a70ee654636626267dcada1c219f95ac", "fc939ae24a6f5216702741bb4525cdfd82406ea2", "cc75f1deaa17e6a3f161d8f8941bc4e3342a87e7"]
