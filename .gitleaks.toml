# Path-scoped, so later edits to this file do not need new commit entries.
# 9a3e336 (WP2 redaction corpus, branch history) and 2977bbd (the same corpus on main via #519) hold the fake PEM literals
# that the corpus used before it was rebuilt at test time (#530). Commit-scoped, not path-scoped: the current file has no literals.
# 525c4ef and fc939ae add the same fake SoulGuard inputs (ghp_, github_pat_, AKIA, AIza placeholders) to SoulGuardTests.cs.
# cc75f1d holds a code identifier (MnemonicKeyMapper), flagged by the generic-api-key rule. Commit-scoped, not a credential.
