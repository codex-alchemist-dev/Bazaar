  optional string message = 2;
  optional int32 retry_after_ms = 3;
}

message WireGcMessage {
  bytes gc_id = 1;
  int64 n = 2;
  int64 ev = 3;
  bytes message_id = 4;
  bytes author_id = 5;
  string text = 6;
  Instant ts = 7;
  bool edited = 8;
  repeated bytes mentions = 9;
  optional int64 reply_to_n = 10;
  bool withdrawn = 11;
}

message WireLimits {
  int32 max_frame_bytes = 1;
  int32 inflight_requests_max = 2;
  int32 replay_page_size = 3;
}

message WirePresenceRow {
