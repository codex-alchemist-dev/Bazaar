}

message TileFrame {
  string view_id = 1;
  int64 graph_version = 2;
  int64 layout_seq = 3;
  TileKey key = 4;
  ZoomTier tier = 5;
  uint32 dimensions = 6;
  repeated string node_ids = 7;
  repeated float xyz = 8;
  repeated ClusterGlyph clusters = 9;
}

