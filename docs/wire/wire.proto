}

message PresenceSnapshotRequest {
}

message PresenceTyping {
  string kind = 1;
  bytes gc_id = 2;
  bytes principal_id = 3;
  bool typing = 4;
  int32 ttl_ms = 5;
}

message PresenceUpdate {
  string kind = 1;
  bytes agent_id = 2;
  int64 revision = 3;
  WirePresenceRow row = 4;
}

message ReleaseArtifact {
  string os = 1;
  string architecture = 2;
  string format = 3;
  string url = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
  optional string sha256_url = 7;
  optional string signature_url = 8;
  optional string signature = 9;
}

message ReleaseManifest {
  string channel = 1;
  string app_version = 2;
  string min_protocol = 3;
  string max_protocol = 4;
  string schema_version = 5;
  string signing_key_fingerprint = 6;
  repeated ReleaseArtifact artifacts = 7;
}

message Resync {
  string s = 1;
  int64 latest_n = 2;
  int64 latest_ev = 3;
  int32 unread = 4;
  repeated WireGcMessage tail = 5;
}

message RoadmapBoardSnapshot {
  bytes vault_id = 1;
  repeated RoadmapPhaseDto phases = 2;
  repeated RoadmapObjectiveDto unphased_objectives = 3;
  repeated string dependency_cycle = 4;
  repeated RoadmapDocumentErrorDto errors = 5;
}

