message Welcome {
  int32 version = 1;
  int32 minor = 2;
  string codec = 3;
  bytes principal_id = 4;
  Instant server_time = 5;
  int32 heartbeat_interval_s = 6;
  int32 heartbeat_timeout_s = 7;
  WireLimits limits = 8;
  repeated string capabilities = 9;
  int64 ui_revision = 10;
  optional bool upgrade_required = 11;
  optional string minimum_build = 12;
  optional string schema_version = 13;
  optional bool previous_major_supported = 14;
}

message WireError {
