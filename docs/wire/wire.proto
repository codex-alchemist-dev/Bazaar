}

message RyuseiTriggerChip {
  bytes trigger_id = 1;
  optional bytes task_id = 2;
  string kind = 3;
  string state = 4;
  Instant next_fire_at = 5;
  string purpose = 6;
  int64 version = 7;
}

message RyuseiTriggerListReply {
