  string path = 1;
  string field = 2;
  string message = 3;
}

message RoadmapObjectiveDto {
  string path = 1;
  string title = 2;
  string phase_slug = 3;
  string status = 4;
  optional string owner = 5;
  repeated string depends_on = 6;
  RoadmapProgressDto progress = 7;
}

message RoadmapPhaseDto {
  string slug = 1;
  string path = 2;
  string title = 3;
  bool gate_passed = 4;
  int32 objective_count = 5;
  int32 open_objectives = 6;
  repeated RoadmapObjectiveDto objectives = 7;
}

message RoadmapProgressDto {
  int32 linked_tasks = 1;
  int32 backlog = 2;
  int32 ready = 3;
  int32 in_progress = 4;
  int32 review = 5;
  int32 done = 6;
  optional string done_share = 7;
}

message RyuseiTriggerChangeReply {
  bytes trigger_id = 1;
  int64 version = 2;
}

message RyuseiTriggerChangeRequest {
