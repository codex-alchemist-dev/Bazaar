  int32 version_max = 2;
  int32 minor = 3;
  repeated string codecs = 4;
  string device_id = 5;
  string device_class = 6;
  string client_build = 7;
  optional string credential = 8;
  StreamCursorList cursors = 9;
}

message KanbanBoardCard {
