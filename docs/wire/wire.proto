enum GraphEdgeKind {
  GRAPH_EDGE_KIND_UNSPECIFIED = 0; // unspecified
  GRAPH_EDGE_KIND_DEPENDS_ON = 1; // dependsOn
  GRAPH_EDGE_KIND_PHASE_MEMBERSHIP = 2; // phaseMembership
  GRAPH_EDGE_KIND_WIKI_LINK = 3; // wikiLink
}

enum GraphNodeKind {
  GRAPH_NODE_KIND_UNSPECIFIED = 0; // unspecified
  GRAPH_NODE_KIND_OBJECTIVE = 1; // objective
  GRAPH_NODE_KIND_PHASE = 2; // phase
  GRAPH_NODE_KIND_VAULT = 3; // vault
}

enum PrincipalKind {
  PRINCIPAL_KIND_OWNER = 0; // owner
  PRINCIPAL_KIND_HUMAN = 1; // human
  PRINCIPAL_KIND_AGENT = 2; // agent
}

enum ZoomTier {
  ZOOM_TIER_FAR = 0; // far
  ZOOM_TIER_MID = 1; // mid
  ZOOM_TIER_NEAR = 2; // near
}

message ClusterGlyph {
  string cluster_id = 1;
  int32 member_count = 2;
  float x = 3;
  float y = 4;
  float z = 5;
}

message FocusRequest {
  string view_id = 1;
  string node_id = 2;
}

message GcEdit {
  bytes gc_id = 1;
  bytes message_id = 2;
  string text = 3;
}

message GcHistory {
  bytes gc_id = 1;
  int64 before = 2;
  int32 limit = 3;
}

message GcMemberAdd {
  bytes gc_id = 1;
  bytes principal_id = 2;
  PrincipalKind kind = 3;
  string role = 4;
}

message GcMemberRemove {
  bytes gc_id = 1;
  bytes principal_id = 2;
}

message GcPage {
  repeated WireGcMessage items = 1;
  bool has_more = 2;
}

message GcRead {
  bytes gc_id = 1;
  int64 up_to_n = 2;
}

message GcSend {
  bytes gc_id = 1;
  string text = 2;
  BytesList mentions = 3;
  optional int64 reply_to_n = 4;
}

message GcSendResult {
  int64 n = 1;
  int64 ev = 2;
}

message GraphEdge {
  string from = 1;
  string to = 2;
  GraphEdgeKind kind = 3;
}

message GraphLodEdge {
  int32 a = 1;
  int32 b = 2;
  int32 weight = 3;
}

message GraphLodFrame {
  string s = 1;
  int64 graph_version = 2;
  bool clusters_only = 3;
  repeated GraphLodGlyph clusters = 4;
  repeated GraphLodEdge cluster_edges = 5;
  repeated GraphLodTile tiles = 6;
}

message GraphLodGlyph {
  int32 cluster = 1;
  repeated float centroid = 2;
  int32 count = 3;
}

message GraphLodTile {
  int32 col = 1;
  int32 row = 2;
  repeated int32 node_indices = 3;
}

message GraphNode {
  string id = 1;
  GraphNodeKind kind = 2;
}

message GraphSnapshot {
  int64 graph_version = 1;
  repeated GraphNode nodes = 2;
  repeated GraphEdge edges = 3;
}

