<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
  <title id="t">Beta roadmap stages with status</title>
  <desc id="d">Nine Beta stages on a line, each marked with its status (done, mostly done, partly done, started or planned), ending in the v1.0.0 Zuhal readiness gate.</desc>
  <rect width="960" height="320" rx="16" fill="#0f1420"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" text-anchor="start">Beta roadmap: nine stages, then the Zuhal gate</text>
  <line x1="40" y1="160" x2="920" y2="160" stroke="#2c3a66" stroke-width="3"/>
  <circle cx="80" cy="160" r="14" fill="#7fd36b"/>  <text x="80" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">1</text>
  <text x="80" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Scaffold and design</text>
  <text x="80" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#7fd36b" text-anchor="middle">Done</text>
  <circle cx="178" cy="160" r="14" fill="#b9e06a"/>  <text x="178" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">2</text>
  <text x="178" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Spikes, gate 1</text>
  <text x="178" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#b9e06a" text-anchor="middle">Mostly done</text>
  <circle cx="276" cy="160" r="14" fill="#f5c451"/>  <text x="276" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">3</text>
  <text x="276" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Foundation</text>
  <text x="276" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#f5c451" text-anchor="middle">Partly done</text>
  <circle cx="374" cy="160" r="14" fill="#f5c451"/>  <text x="374" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">4</text>
  <text x="374" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Company core</text>
  <text x="374" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#f5c451" text-anchor="middle">Partly done</text>
  <circle cx="472" cy="160" r="14" fill="#f5c451"/>  <text x="472" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">5</text>
  <text x="472" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Knowledge and identity</text>
  <text x="472" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#f5c451" text-anchor="middle">Partly done</text>
  <circle cx="570" cy="160" r="14" fill="#f5c451"/>  <text x="570" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">6</text>
  <text x="570" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Windows client</text>
  <text x="570" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#f5c451" text-anchor="middle">Partly done</text>
  <circle cx="668" cy="160" r="14" fill="#f5c451"/>  <text x="668" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">7</text>
  <text x="668" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Android and Linux</text>
  <text x="668" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#f5c451" text-anchor="middle">Partly done</text>
  <circle cx="766" cy="160" r="14" fill="#7fb0ff"/>  <text x="766" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">8</text>
  <text x="766" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Environments and engines</text>
  <text x="766" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#7fb0ff" text-anchor="middle">Planned</text>
  <circle cx="864" cy="160" r="14" fill="#f5a25a"/>  <text x="864" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1420" text-anchor="middle">9</text>
  <text x="864" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eefc" text-anchor="middle">Hardening</text>
  <text x="864" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#f5a25a" text-anchor="middle">Started</text>
  <rect x="40" y="120" width="880" height="0" rx="10" fill="none" stroke="none" stroke-width="2"/>
  <rect x="40" y="236" width="880" height="40" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="480" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#eefbe9" text-anchor="middle">v1.0.0 Zuhal: the readiness gate. Scope decided; no date. Beta stays 0.x until the owner says go.</text>
  <circle cx="40" cy="296" r="8" fill="#7fd36b"/>  <text x="54" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Done</text>
  <circle cx="190" cy="296" r="8" fill="#b9e06a"/>  <text x="204" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Mostly done</text>
  <circle cx="340" cy="296" r="8" fill="#f5c451"/>  <text x="354" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">In progress</text>
  <circle cx="490" cy="296" r="8" fill="#7fb0ff"/>  <text x="504" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Planned</text>
  <circle cx="640" cy="296" r="8" fill="#e07a5f"/>  <text x="654" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Blocked</text>
</svg>
