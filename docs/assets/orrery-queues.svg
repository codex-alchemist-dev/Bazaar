<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t d">
  <title id="t">Orrery per-agent queues with a wake cap</title>
  <desc id="d">Three agents, each with a queued wake, and a panel showing a per-agent wake cap.</desc>
  <rect width="960" height="290" rx="16" fill="#0f1420"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" text-anchor="start">Orrery per agent: each agent's own wake queue</text>
  <rect x="40" y="90" width="160" height="44" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="120" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8eefc" text-anchor="middle">Analyst</text>
  <line x1="200" y1="112" x2="520" y2="112" stroke="#4d6fb3" stroke-width="2"/>
  <rect x="520" y="90" width="180" height="44" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="610" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Queued: review PR 512</text>
  <rect x="40" y="150" width="160" height="44" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="120" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8eefc" text-anchor="middle">Builder</text>
  <line x1="200" y1="172" x2="520" y2="172" stroke="#4d6fb3" stroke-width="2"/>
  <rect x="520" y="150" width="180" height="44" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="610" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Queued: build check</text>
  <rect x="40" y="210" width="160" height="44" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="120" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8eefc" text-anchor="middle">Reviewer</text>
  <line x1="200" y1="232" x2="520" y2="232" stroke="#4d6fb3" stroke-width="2"/>
  <rect x="520" y="210" width="180" height="44" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="610" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Queued: daily digest</text>
  <rect x="740" y="90" width="180" height="164" rx="10" fill="#151d30" stroke="#2c3a66" stroke-width="2"/>
  <text x="830" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#9fb3d9" text-anchor="middle">Wake cap</text>
  <text x="830" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#e8eefc" text-anchor="middle">A set cap per agent</text>
  <text x="830" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#e8eefc" text-anchor="middle">per period</text>
  <text x="830" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#9fb3d9" text-anchor="middle">Each agent has its own cap</text>
  <text x="40" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">An agent can queue a wake for itself or a colleague. The cap keeps any one agent from flooding the queue.</text>

</svg>
