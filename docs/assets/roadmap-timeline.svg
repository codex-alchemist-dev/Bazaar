<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Roadmap timeline: nine Beta stages, then the Zuhal readiness gate</title>
  <desc id="d">A timeline of nine Beta stages from Scaffold to Hardening, ending in the v1.0.0 Zuhal readiness gate. Each stage is a box with its number and name.</desc>
  <rect width="960" height="300" rx="16" fill="#0f1420"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" text-anchor="start">Roadmap: objectives, phases and gates, read from the Vault</text>
  <line x1="40" y1="150" x2="920" y2="150" stroke="#4d6fb3" stroke-width="2"/>
  <rect x="40" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="84" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">1</text>
  <text x="84" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Scaffold</text>
  <rect x="136" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="180" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">2</text>
  <text x="180" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Spikes</text>
  <rect x="232" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="276" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">3</text>
  <text x="276" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Foundation</text>
  <rect x="328" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="372" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">4</text>
  <text x="372" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Company core</text>
  <rect x="424" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="468" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">5</text>
  <text x="468" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Knowledge</text>
  <rect x="520" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="564" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">6</text>
  <text x="564" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Windows</text>
  <rect x="616" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="660" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">7</text>
  <text x="660" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Android, Linux</text>
  <rect x="712" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="756" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">8</text>
  <text x="756" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Environments</text>
  <rect x="808" y="120" width="88" height="56" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="852" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="middle">9</text>
  <text x="852" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#9fb3d9" text-anchor="middle">Hardening</text>
  <rect x="40" y="196" width="880" height="40" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="480" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#eefbe9" text-anchor="middle">v1.0.0 Zuhal: the readiness gate, read against every stage above</text>
  <text x="40" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Each stage is a label, not a version number. Stages open only when their gates pass.</text>

</svg>
