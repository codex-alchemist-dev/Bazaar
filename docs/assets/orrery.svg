<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="t d">
  <title id="t">Orrery: per-agent triggers that wake an agent, with every fire audited</title>
  <desc id="d">Four trigger types feed one scheduler: a timer, an interval, a watcher on a file or event, and an event from the company. The scheduler wakes the agent, the fire is written to the audit log, and a loop guard caps how many wakes can chain.</desc>
  <rect width="960" height="260" rx="16" fill="#101a10"/>
  <text x="40" y="44" fill="#eefbe9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Orrery: scheduled wakes, every fire on record</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="40" y="80" width="170" height="44" rx="10" fill="#1f3320" stroke="#4f8a46"/><text x="125" y="107" fill="#eefbe9">Timer</text>
    <rect x="40" y="136" width="170" height="44" rx="10" fill="#1f3320" stroke="#4f8a46"/><text x="125" y="163" fill="#eefbe9">Interval</text>
    <rect x="40" y="192" width="170" height="44" rx="10" fill="#1f3320" stroke="#4f8a46"/><text x="125" y="219" fill="#eefbe9">Watcher or event</text>
    <rect x="300" y="110" width="190" height="80" rx="12" fill="#23402a" stroke="#7fd36b" stroke-width="2"/><text x="395" y="146" fill="#eefbe9" font-weight="700">Scheduler</text><text x="395" y="170" fill="#b7dcae" font-size="13">one tick, per-agent cap</text>
    <rect x="620" y="60" width="150" height="50" rx="10" fill="#1f3320" stroke="#4f8a46"/><text x="695" y="90" fill="#eefbe9">Wake agent</text>
    <rect x="620" y="150" width="150" height="50" rx="10" fill="#1f3320" stroke="#4f8a46"/><text x="695" y="180" fill="#eefbe9">Audit log</text>
  </g>
  <g stroke="#7fd36b" stroke-width="2" fill="none">
    <line x1="210" y1="102" x2="300" y2="138"/><line x1="210" y1="158" x2="300" y2="150"/><line x1="210" y1="214" x2="300" y2="162"/>
    <line x1="490" y1="130" x2="620" y2="85"/><line x1="490" y1="170" x2="620" y2="175"/>
  </g>
  <text x="40" y="250" fill="#b7dcae" font-family="Segoe UI, Arial, sans-serif" font-size="13">A loop guard stops a chain of wakes that never ends. Every trip is recorded.</text>
</svg>
