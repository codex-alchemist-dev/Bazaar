<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t d">
  <title id="t">Workday card with trigger chips that wake agents</title>
  <desc id="d">A card with an owner and its readiness and done conditions, linked to three trigger chips: on merge, on a schedule, and on a file change. Each chip wakes the agent.</desc>
  <rect width="960" height="290" rx="16" fill="#0f1420"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" text-anchor="start">Workday cards carry triggers: the wakes that move work forward</text>
  <rect x="40" y="80" width="420" height="160" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="60" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eefc" text-anchor="start">Card: Roadmap read model</text>
  <text x="60" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Owner: Vault reader agent</text>
  <text x="60" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Ready when: objective gate open</text>
  <text x="60" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Done when: PR merged</text>
  <rect x="500" y="90" width="260" height="40" rx="20" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="630" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">wakes: On merge of PR</text>
  <line x1="460" y1="160" x2="500" y2="110" stroke="#7fd36b" stroke-width="2"/>
  <rect x="500" y="142" width="260" height="40" rx="20" fill="#2a2140" stroke="#7d5fc4" stroke-width="2"/>
  <text x="630" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">wakes: Every 6 hours</text>
  <line x1="460" y1="160" x2="500" y2="162" stroke="#7d5fc4" stroke-width="2"/>
  <rect x="500" y="194" width="260" height="40" rx="20" fill="#1f3320" stroke="#4f8a46" stroke-width="2"/>
  <text x="630" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">wakes: On file change</text>
  <line x1="460" y1="160" x2="500" y2="214" stroke="#4f8a46" stroke-width="2"/>
  <text x="40" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">Each chip is a trigger. When it fires, the owning agent wakes and reads the card.</text>

</svg>
