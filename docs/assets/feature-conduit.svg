<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-labelledby="t d">
  <title id="t">Conduit: reach your server from anywhere</title>
  <desc id="d">A phone and a laptop connect to a server through a list of routes, each pinned to the server key. Routes are in flight.</desc>
  <rect width="480" height="220" rx="14" fill="#0d1117"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="28" y="70" width="70" height="90" rx="10" fill="#1c2330" stroke="#7cc4ff" stroke-width="1.5"/>
    <text x="63" y="122" font-size="12" fill="#f0f6fc" text-anchor="middle">Phone</text>
    <rect x="384" y="70" width="70" height="90" rx="10" fill="#1c2330" stroke="#9be38f" stroke-width="1.5"/>
    <text x="419" y="122" font-size="12" fill="#f0f6fc" text-anchor="middle">Server</text>
    <g font-size="12" fill="#c9d1d9">
      <text x="120" y="50">LAN discovery</text>
      <text x="120" y="78">Port forward / UPnP</text>
      <text x="120" y="106">Cloudflare Tunnel</text>
      <text x="120" y="134">Tailscale / WireGuard</text>
      <text x="120" y="162">Relay · P2P · Tor · SSH</text>
    </g>
    <g stroke="#3b4a63" stroke-width="1.5" stroke-dasharray="5 4">
      <line x1="100" y1="115" x2="380" y2="115"/>
    </g>
    <text x="240" y="200" font-size="12" fill="#f2b84b" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">In flight · key-pinned on every route</text>
  </g>
</svg>
