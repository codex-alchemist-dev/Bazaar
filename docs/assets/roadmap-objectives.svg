<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">Roadmap objectives and gates as a graph</title>
  <desc id="d">Objective nodes link to gate nodes, and gates link to the readiness gate. Arrows show which gates must pass before an objective closes.</desc>
  <rect width="960" height="280" rx="16" fill="#0f1420"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" text-anchor="start">Roadmap objectives: a graph of goals and their gates</text>
  <line x1="150" y1="130" x2="280" y2="220" stroke="#7fd36b" stroke-width="2"/>
  <line x1="400" y1="130" x2="280" y2="220" stroke="#7fd36b" stroke-width="2"/>
  <line x1="650" y1="130" x2="540" y2="220" stroke="#7fd36b" stroke-width="2"/>
  <line x1="400" y1="130" x2="410" y2="80" stroke="#7fd36b" stroke-width="2"/>
  <line x1="540" y1="220" x2="410" y2="80" stroke="#7fd36b" stroke-width="2"/>
  <rect x="50" y="110" width="200" height="40" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="150" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Objective: GC log</text>
  <rect x="300" y="110" width="200" height="40" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="400" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Objective: Constellation</text>
  <rect x="550" y="110" width="200" height="40" rx="10" fill="#1d2a44" stroke="#4d6fb3" stroke-width="2"/>
  <text x="650" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Objective: RyuseiFuda</text>
  <rect x="190" y="200" width="180" height="40" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="280" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Gate: fold-aware client</text>
  <rect x="450" y="200" width="180" height="40" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="540" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Gate: scheduler on</text>
  <rect x="320" y="60" width="180" height="40" rx="10" fill="#23402a" stroke="#7fd36b" stroke-width="2"/>
  <text x="410" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#eefbe9" text-anchor="middle">Gate: v1 readiness</text>
  <text x="40" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb3d9" text-anchor="start">An objective is done when its gates pass. Arrows show what must pass first.</text>

</svg>
