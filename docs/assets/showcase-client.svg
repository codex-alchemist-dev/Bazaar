<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
  <title id="t">Bazaar.Client: the command room, built for each company</title>
  <desc id="d">A dark banner for the client category. On the left, the title and a line saying it is native Avalonia, built per company, with the same shared UI library on every device. On the right, four tiles show the client's main surfaces: group chats, Constellation, RyuseiFuda, and the built-in Calcinato terminal and Athanor editor.</desc>
  <defs>
    <radialGradient id="glowC" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a2a66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a1426" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="320" rx="16" fill="#1a1426"/>
  <rect width="960" height="320" rx="16" fill="url(#glowC)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="92" fill="#f4edff" font-size="40" font-weight="800">Bazaar.Client</text>
    <text x="48" y="128" fill="#c8b8ea" font-size="17">The command room. Native Avalonia apps,</text>
    <text x="48" y="150" fill="#c8b8ea" font-size="17">built for each company, on every device.</text>
    <text x="48" y="206" fill="#9d86d6" font-size="14">Group chats  ·  Constellation  ·  RyuseiFuda</text>
    <text x="48" y="228" fill="#9d86d6" font-size="14">Calcinato (terminal)  ·  Athanor (editor)</text>
    <g font-size="16" text-anchor="middle">
      <rect x="500" y="40" width="200" height="110" rx="12" fill="#2a2140" stroke="#7d5fc4" stroke-width="2"/>
      <text x="600" y="90" fill="#f4edff" font-weight="700">Group chats</text>
      <text x="600" y="116" fill="#c8b8ea" font-size="13">the coordination record</text>
      <rect x="720" y="40" width="200" height="110" rx="12" fill="#2a2140" stroke="#7d5fc4" stroke-width="2"/>
      <text x="820" y="90" fill="#f4edff" font-weight="700">Constellation</text>
      <text x="820" y="116" fill="#c8b8ea" font-size="13">the knowledge graph</text>
      <rect x="500" y="170" width="200" height="110" rx="12" fill="#2a2140" stroke="#7d5fc4" stroke-width="2"/>
      <text x="600" y="220" fill="#f4edff" font-weight="700">RyuseiFuda</text>
      <text x="600" y="246" fill="#c8b8ea" font-size="13">the company planner</text>
      <rect x="720" y="170" width="200" height="110" rx="12" fill="#2a2140" stroke="#7d5fc4" stroke-width="2"/>
      <text x="820" y="212" fill="#f4edff" font-weight="700">Calcinato</text>
      <text x="820" y="234" fill="#c8b8ea" font-size="13">terminal and CLI</text>
      <text x="820" y="256" fill="#c8b8ea" font-size="13">+ Athanor, the editor</text>
    </g>
  </g>
</svg>
