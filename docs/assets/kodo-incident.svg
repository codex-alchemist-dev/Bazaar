<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t d">
  <title id="t">Kodo incident mode and chaos testing: guided recovery, every step audited</title>
  <desc id="d">Incident mode opens a record, freezes risky changes, snapshots evidence, notifies roles and guides recovery with runbooks. Chaos testing runs in a sandbox copy and produces a resilience score.</desc>
  <rect width="960" height="290" rx="16" fill="#0f1420"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc">Incident mode: freeze, snapshot, guide, record every step</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="70" width="560" height="150" rx="12" fill="#151d30" stroke="#2c3a66" stroke-width="2"/>
    <g font-size="13" fill="#e8eefc">
      <circle cx="72" cy="104" r="12" fill="#2a1820" stroke="#ff7b72" stroke-width="2"/><text x="72" y="109" font-size="12" text-anchor="middle" fill="#ffb4ae">1</text>
      <text x="96" y="109">Incident record opened</text>
      <circle cx="72" cy="140" r="12" fill="#2a2414" stroke="#f2b84b" stroke-width="2"/><text x="72" y="145" font-size="12" text-anchor="middle" fill="#f2b84b">2</text>
      <text x="96" y="145">Risky changes frozen</text>
      <circle cx="72" cy="176" r="12" fill="#151d30" stroke="#7cc4ff" stroke-width="2"/><text x="72" y="181" font-size="12" text-anchor="middle" fill="#7cc4ff">3</text>
      <text x="96" y="181">Evidence snapshotted</text>
      <circle cx="330" cy="104" r="12" fill="#151d30" stroke="#7cc4ff" stroke-width="2"/><text x="330" y="109" font-size="12" text-anchor="middle" fill="#7cc4ff">4</text>
      <text x="354" y="109">Roles notified</text>
      <circle cx="330" cy="140" r="12" fill="#14291f" stroke="#9be38f" stroke-width="2"/><text x="330" y="145" font-size="12" text-anchor="middle" fill="#9be38f">5</text>
      <text x="354" y="145">Guided recovery, runbooks</text>
      <circle cx="330" cy="176" r="12" fill="#14291f" stroke="#9be38f" stroke-width="2"/><text x="330" y="181" font-size="12" text-anchor="middle" fill="#9be38f">6</text>
      <text x="354" y="181">Every step audited</text>
    </g>
    <rect x="620" y="70" width="300" height="150" rx="12" fill="#0d1117" stroke="#2c3a66" stroke-width="2"/>
    <text x="640" y="96" font-size="13" font-weight="600" fill="#9fb3d9">Runbook · one-click fix</text>
    <text x="640" y="122" font-size="12" fill="#e8eefc">Preview: restart Conduit route</text>
    <text x="640" y="144" font-size="12" fill="#e8eefc">Verify: route answers, key pinned</text>
    <rect x="640" y="164" width="120" height="34" rx="8" fill="#14291f" stroke="#9be38f" stroke-width="1.5"/>
    <text x="700" y="186" font-size="12" fill="#9be38f" text-anchor="middle">Approve</text>
    <rect x="40" y="236" width="880" height="34" rx="10" fill="#151d30" stroke="#2c3a66" stroke-width="2"/>
    <text x="60" y="258" font-size="13" fill="#9fb3d9">Chaos mode, in a sandbox copy only:</text>
    <text x="330" y="258" font-size="13" fill="#e8eefc">faults injected on purpose, a resilience score</text>
  </g>
  <text x="480" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f2b84b" text-anchor="middle">Planned. Owner-enabled chaos runs in a sandbox copy, never on the live company.</text>
</svg>
