<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Bazaar architecture: Core and modules</title>
  <desc id="d">Bazaar.Core, the kernel, sits under a row of slot-in modules. Clients sit above the server and render what it provides.</desc>
  <rect width="960" height="520" rx="16" fill="#0d1117"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <!-- clients -->
    <text x="480" y="44" font-size="14" fill="#8b949e" letter-spacing="2">CLIENTS RENDER, SERVER COMPUTES</text>
    <rect x="150" y="60" width="180" height="60" rx="10" fill="#1c2330" stroke="#7cc4ff" stroke-width="2"/>
    <text x="240" y="96" font-size="17" fill="#f0f6fc" font-weight="600">Windows client</text>
    <rect x="390" y="60" width="180" height="60" rx="10" fill="#1c2330" stroke="#7cc4ff" stroke-width="2"/>
    <text x="480" y="96" font-size="17" fill="#f0f6fc" font-weight="600">Android client</text>
    <rect x="630" y="60" width="180" height="60" rx="10" fill="#1c2330" stroke="#7cc4ff" stroke-width="2"/>
    <text x="720" y="96" font-size="17" fill="#f0f6fc" font-weight="600">Linux client</text>
    <!-- wire -->
    <line x1="480" y1="120" x2="480" y2="158" stroke="#3b4a63" stroke-width="2"/>
    <text x="560" y="144" font-size="13" fill="#8b949e">JSON wire, one socket</text>
    <!-- modules -->
    <rect x="60" y="160" width="840" height="120" rx="12" fill="#161b22" stroke="#3b4a63" stroke-width="1.5"/>
    <text x="480" y="186" font-size="14" fill="#8b949e" letter-spacing="2">MODULES, EACH WITH ITS OWN DATA AND CONTRACT</text>
    <rect x="80" y="200" width="150" height="62" rx="10" fill="#1c2330" stroke="#f2b84b" stroke-width="2"/>
    <text x="155" y="226" font-size="16" fill="#f0f6fc" font-weight="600">Bazaar.GC</text>
    <text x="155" y="248" font-size="12" fill="#8b949e">group chats, log</text>
    <rect x="250" y="200" width="150" height="62" rx="10" fill="#1c2330" stroke="#f2b84b" stroke-width="2"/>
    <text x="325" y="226" font-size="16" fill="#f0f6fc" font-weight="600">Constellation</text>
    <text x="325" y="248" font-size="12" fill="#8b949e">knowledge graph</text>
    <rect x="420" y="200" width="200" height="62" rx="10" fill="#1c2330" stroke="#f2b84b" stroke-width="2"/>
    <text x="520" y="226" font-size="16" fill="#f0f6fc" font-weight="600">RyuseiFuda</text>
    <text x="520" y="248" font-size="12" fill="#8b949e">Workday · Orrery · Roadmap</text>
    <rect x="640" y="200" width="120" height="62" rx="10" fill="#1c2330" stroke="#f2b84b" stroke-width="2"/>
    <text x="700" y="226" font-size="16" fill="#f0f6fc" font-weight="600">Vault</text>
    <text x="700" y="248" font-size="12" fill="#8b949e">Markdown in git</text>
    <rect x="780" y="200" width="100" height="62" rx="10" fill="#1c2330" stroke="#f2b84b" stroke-width="2"/>
    <text x="830" y="226" font-size="16" fill="#f0f6fc" font-weight="600">Gateway</text>
    <text x="830" y="248" font-size="12" fill="#8b949e">models</text>
    <!-- connectors -->
    <line x1="480" y1="280" x2="480" y2="318" stroke="#3b4a63" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- kernel -->
    <rect x="60" y="320" width="840" height="78" rx="12" fill="#1c2330" stroke="#9be38f" stroke-width="2"/>
    <text x="480" y="352" font-size="18" fill="#f0f6fc" font-weight="700">Bazaar.Core (kernel)</text>
    <text x="480" y="378" font-size="13" fill="#c9d1d9">component runtime · configuration · database and migrations · wire transport · secrets · status</text>
    <!-- database -->
    <line x1="480" y1="398" x2="480" y2="430" stroke="#3b4a63" stroke-width="2"/>
    <rect x="300" y="432" width="360" height="54" rx="10" fill="#161b22" stroke="#3b4a63" stroke-width="1.5"/>
    <text x="480" y="456" font-size="15" fill="#f0f6fc" font-weight="600">PostgreSQL 18 + pgvector, managed by Bazaar</text>
    <text x="480" y="476" font-size="12" fill="#8b949e">the log and indexes; Vault files stay in git</text>
    <!-- conduit -->
    <rect x="700" y="28" width="210" height="0" fill="none"/>
  </g>
</svg>
