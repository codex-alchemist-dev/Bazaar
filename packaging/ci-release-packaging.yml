# Release pipeline for Bazaar (docs/design/37-distribution-matrix-and-packaging.md, section 4).
#
# Trigger: an annotated tag v00.MM.PP on a commit that is reachable from main.
# Flow:
#   1. validate  - checks the tag form, the annotation, main ancestry and VersionPrefix.
#   2. builds    - windows, linux, macos (opt-in) and android (only when the project exists)
#                  run in parallel. Each runs the full build and test, publishes the
#                  heads it has, signs only when that platform's secrets exist, writes its
#                  own SHA256SUMS and uploads a dist-<platform> artifact.
#   3. release   - merges the checksums, verifies every archive, and creates a DRAFT GitHub
#                  Release (pre-release flag, because 0.x is the Beta channel). A person
#                  publishes it after reviewing the notes.
#
# No artifact is built by hand. Signing is parked until the owner supplies certificates
# (doc 37 section 7); unsigned artifacts are labelled as such in the release notes.
#
# Security rules (same as ci.yml): every third-party action is pinned to a full commit SHA
# with the version in a trailing comment. The default token is read-only; only the release
# job gets contents: write. Secrets are read only in the steps that use them, and only on
# tag pushes. No job depends on a secret to succeed; a missing secret means an unsigned build.

name: Release

on:
  push:
    tags:
      - 'v00.[0-9][0-9].[0-9][0-9]'

permissions:
  contents: read

concurrency:
  # Never cancel a release in progress. A second run for the same tag waits for the first.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      semver: ${{ steps.version.outputs.semver }}
      android: ${{ steps.version.outputs.android }}
    steps:
      # Full history: needed for the main-ancestry check. Tags are fetched with it.
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag form, annotation, main ancestry and VersionPrefix
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # docs/VERSIONING.md: display form v00.MM.PP maps to SemVer 0.MM.PP.
          if [[ ! "$TAG" =~ ^v00\.([0-9]{2})\.([0-9]{2})$ ]]; then
            echo "::error::Tag '$TAG' does not match v00.MM.PP."
            exit 1
          fi
          semver="0.$((10#${BASH_REMATCH[1]})).$((10#${BASH_REMATCH[2]}))"

          # Tags are annotated and immutable (doc 37 section 3).
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "::error::Tag '$TAG' is lightweight. Release tags must be annotated."
            exit 1
          fi

          # The tagged commit must be on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/main"; then
            echo "::error::Tag '$TAG' ($GITHUB_SHA) is not reachable from main."
            exit 1
          fi

          # VersionPrefix in Directory.Build.props is the product version and must agree with the tag.
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ "$prefix" != "$semver" ]]; then
            echo "::error::Tag '$TAG' maps to $semver but Directory.Build.props has VersionPrefix '$prefix'."
            exit 1
          fi

          # Android is built only once its project exists in the repo.
          android=false
          if compgen -G "src/Bazaar.Client.Android/*.csproj" > /dev/null; then android=true; fi

          {
            echo "tag=$TAG"
            echo "semver=$semver"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG is version $semver; Android build: $android."

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      SEMVER: ${{ needs.validate.outputs.semver }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Same build, format check and tests as CI. Tests that need PostgreSQL are skipped
      # here, as they are in CI on Windows (hosted Windows runners have no Linux containers).
      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Publish Windows x64 heads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Publish-Head([string]$Project, [string]$Dir) {
              dotnet publish $Project -c Release -r win-x64 --self-contained true -o $Dir
              if ($LASTEXITCODE -ne 0) { throw "publish failed: $Project" }
          }
          Publish-Head 'src/Bazaar.Server.Host/Bazaar.Server.Host.csproj' 'stage/server'
          Publish-Head 'src/Bazaar.Client.Windows/Bazaar.Client.Windows.csproj' 'stage/client-windows'
          Publish-Head 'src/Bazaar.Client.Terminal/Bazaar.Client.Terminal.csproj' 'stage/client-terminal'

      - name: Detect Windows signing secret
        id: signing
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          if [[ -n "$PFX_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Windows code-signing certificate configured. Artifacts will be unsigned."
          fi

      # Authenticode with a PFX certificate. The certificate is written to the runner temp
      # folder for this step only and deleted at the end.
      - name: Sign Windows executables
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
              $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                  Where-Object { $_.FullName -match '\\x64\\' } |
                  Sort-Object FullName | Select-Object -Last 1
              if (-not $signtool) { throw 'signtool.exe not found on the runner' }
              foreach ($exe in Get-ChildItem stage -Recurse -Filter *.exe) {
                  & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
                      /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
                  if ($LASTEXITCODE -ne 0) { throw "signing failed: $($exe.Name)" }
              }
          }
          finally {
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package, checksum and record signing state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $packages = @(
              @{ Dir = 'stage/server';          Zip = "Bazaar.Server-$env:SEMVER-win-x64.zip" },
              @{ Dir = 'stage/client-windows';  Zip = "Bazaar.Client.Windows-$env:SEMVER-win-x64.zip" },
              @{ Dir = 'stage/client-terminal'; Zip = "Bazaar.Client.Terminal-$env:SEMVER-win-x64.zip" }
          )
          foreach ($p in $packages) {
              Compress-Archive -Path (Join-Path $p.Dir '*') -DestinationPath (Join-Path 'dist' $p.Zip)
          }
          $state = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { 'signed' } else { 'unsigned (no signing certificate configured)' }
          Set-Content -Path 'dist/SIGNING-windows.txt' -Value $state

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      SEMVER: ${{ needs.validate.outputs.semver }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Same PostgreSQL service as CI, so the SQL tests run before a release is built.
      - name: Start PostgreSQL 18 with pgvector
        run: |
          set -euo pipefail
          docker run -d --name bazaar-pg -e POSTGRES_PASSWORD=bazaar -p 5432:5432 \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30 \
            pgvector/pgvector:pg18
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bazaar-pg)" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' bazaar-pg)" = healthy ]
          echo "BAZAAR_TEST_PG=Host=localhost;Port=5432;Username=postgres;Password=bazaar" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./build.sh

      - name: Publish Linux x64 heads
        shell: bash
        run: |
          set -euo pipefail
          publish() { dotnet publish "$1" -c Release -r linux-x64 --self-contained true -o "$2"; }
          publish src/Bazaar.Server.Host/Bazaar.Server.Host.csproj stage/server
          publish src/Bazaar.Client.Linux/Bazaar.Client.Linux.csproj stage/client-linux
          publish src/Bazaar.Client.Terminal/Bazaar.Client.Terminal.csproj stage/client-terminal

      # Linux packages (AppImage, deb, rpm, Flatpak) are not in the repo yet (doc 37 section 2).
      # This job ships portable archives only.
      - name: Package, checksum and record signing state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C stage/server -czf "dist/Bazaar.Server-$SEMVER-linux-x64.tar.gz" .
          tar -C stage/client-linux -czf "dist/Bazaar.Client.Linux-$SEMVER-linux-x64.tar.gz" .
          tar -C stage/client-terminal -czf "dist/Bazaar.Client.Terminal-$SEMVER-linux-x64.tar.gz" .
          echo "unsigned (no Linux signing configured)" > dist/SIGNING-linux.txt
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64 (opt-in)
    needs: validate
    # Off until the owner confirms macOS for v1 (doc 37 section 6). Enable with the repository
    # variable MACOS_BUILDS=true. A variable is not a secret.
    if: vars.MACOS_BUILDS == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      SEMVER: ${{ needs.validate.outputs.semver }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build and test
        run: ./build.sh

      - name: Publish macOS arm64 heads
        shell: bash
        run: |
          set -euo pipefail
          publish() { dotnet publish "$1" -c Release -r osx-arm64 --self-contained true -o "$2"; }
          publish src/Bazaar.Server.Host/Bazaar.Server.Host.csproj stage/server
          publish src/Bazaar.Client.Terminal/Bazaar.Client.Terminal.csproj stage/client-terminal

      - name: Detect Apple signing secrets
        id: signing
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [[ -n "$P12_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate configured. Artifacts will be unsigned and not notarised."
          fi

      # Developer ID signing with a temporary keychain that is removed at the end.
      - name: Sign Mach-O binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/bazaar-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"

          find stage -type f | while IFS= read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$IDENTITY" "$f"
            fi
          done

      - name: Package, notarise and checksum
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # ditto keeps the executable bit and resource forks, which tar.gz and zip can lose here.
          ditto -c -k --keepParent stage/server "dist/Bazaar.Server-$SEMVER-osx-arm64.zip"
          ditto -c -k --keepParent stage/client-terminal "dist/Bazaar.Client.Terminal-$SEMVER-osx-arm64.zip"

          if [[ "$SIGNING" == "true" ]]; then
            for z in dist/*.zip; do
              xcrun notarytool submit "$z" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait
            done
            echo "signed and notarised" > dist/SIGNING-macos.txt
          else
            echo "unsigned (no Developer ID configured)" > dist/SIGNING-macos.txt
          fi

          cd dist
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: validate
    # Runs only once src/Bazaar.Client.Android exists (doc 29). Play upload is parked (doc 37 section 7).
    if: needs.validate.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      SEMVER: ${{ needs.validate.outputs.semver }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build and test
        run: ./build.sh

      - name: Detect Android signing secret
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Android release keystore configured. The APK will be unsigned."
          fi

      - name: Publish APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          project=src/Bazaar.Client.Android/Bazaar.Client.Android.csproj
          extra=()
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            extra+=(
              -p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore"
              "-p:AndroidSigningStorePass=$KEYSTORE_PASSWORD"
              "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
              "-p:AndroidSigningKeyPass=$KEY_PASSWORD"
            )
          fi
          dotnet publish "$project" -c Release -p:AndroidPackageFormat=apk -o stage/android "${extra[@]}"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Package, checksum and record signing state
        shell: bash
        env:
          SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find stage/android -name '*.apk' | head -n 1)"
          if [[ -z "$apk" ]]; then echo "::error::No APK was produced."; exit 1; fi
          cp "$apk" "dist/Bazaar.Client.Android-$SEMVER.apk"
          if [[ "$SIGNING" == "true" ]]; then
            echo "signed" > dist/SIGNING-android.txt
          else
            echo "unsigned (no Android keystore configured)" > dist/SIGNING-android.txt
          fi
          cd dist
          sha256sum -- *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub Release
    needs: [validate, windows, linux, macos, android]
    # Runs only when every required build passed. Skipped optional builds (macOS, Android) are fine.
    if: >-
      ${{ !cancelled()
        && needs.validate.result == 'success'
        && needs.windows.result == 'success'
        && needs.linux.result == 'success'
        && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
        && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to create the release and upload its assets. Nothing else in the workflow has it.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.tag }}
      SEMVER: ${{ needs.validate.outputs.semver }}
    steps:
      # No checkout: the release needs only the artifacts and the tag, which gh verifies on the server.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: staging

      - name: Assemble assets and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find staging -mindepth 2 -maxdepth 2 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) \
            -exec mv {} assets/ \;
          cat staging/dist-*/SHA256SUMS > assets/SHA256SUMS

          # Every archive must be listed in the merged sums, and every listed file must match.
          for f in assets/*.zip assets/*.tar.gz assets/*.apk; do
            [ -e "$f" ] || continue
            grep -q "  $(basename "$f")\$" assets/SHA256SUMS || { echo "::error::$f is not in SHA256SUMS"; exit 1; }
          done
          (cd assets && sha256sum -c SHA256SUMS)

          # The minimum set: the server and the Windows client, from the required jobs.
          ls assets/Bazaar.Server-"$SEMVER"-win-x64.zip assets/Bazaar.Server-"$SEMVER"-linux-x64.tar.gz > /dev/null

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Bazaar $TAG (version $SEMVER). Beta pre-release."
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "Signing status:"
          } > notes.md
          for f in staging/dist-*/SIGNING-*.txt; do
            platform="$(basename "$f" .txt)"
            echo "- ${platform#SIGNING-}: $(cat "$f")" >> notes.md
          done

      # Created as a draft. A person reviews the notes and publishes it.
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" assets/* \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Bazaar $TAG" \
            --notes-file notes.md
