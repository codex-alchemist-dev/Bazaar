# Flatpak manifest for the Bazaar Linux desktop client (Bazaar.Client.Linux).
#
# Status: SPIKE (doc 30, section 3 and work package 9). Not verified with flatpak-builder.
# Not for Flathub submission. Local build only until the spike passes.
#
# Build (outside this repo's CI, on a machine with flatpak and flatpak-builder):
#   1. Generate the offline NuGet sources (see generated-sources.json below).
#   2. flatpak-builder --user --install --force-clean build-dir TheBazaarAuthors.BazaarClient.yml
#   3. flatpak run TheBazaarAuthors.BazaarClient

app-id: TheBazaarAuthors.BazaarClient
runtime: org.freedesktop.Platform
runtime-version: '25.08'        # UNVERIFIED: pin the current freedesktop runtime branch before the spike
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet11   # UNVERIFIED: extension name and branch for .NET 11 (repo global.json pins 11.0.100-rc)
command: bazaar-client

finish-args:
  # Window system: Wayland first, X11 as fallback (Avalonia supports both; doc 30 section 1).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Network: the client talks to the Bazaar server over the network.
  - --share=network
  # No filesystem, session bus, or host-process access by default.
  # The local terminal (doc 30 section 2) runs a shell inside the sandbox only.
  # Any host reach for the terminal is an open decision and must be added deliberately.

build-options:
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_NOLOGO: '1'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    NUGET_PACKAGES: /run/build/bazaar-client/nuget-cache
  append-path: /usr/lib/sdk/dotnet/bin
  # The SDK extension provides the dotnet SDK during the build only.

modules:
  - name: bazaar-client
    buildsystem: simple
    # No build-args: the build stays offline and fails loudly if the generated NuGet sources are incomplete.
    build-commands:
      # Self-contained publish: the app ships its own .NET runtime, so the
      # runtime does not need a separate .NET extension at run time (doc 30: self-contained builds).
      - >-
        dotnet publish src/Bazaar.Client.Linux/Bazaar.Client.Linux.csproj
        --configuration Release
        --runtime linux-x64
        --self-contained true
        --source /run/build/bazaar-client/nuget-sources
        --output /app/lib/bazaar-client
      - install -Dm755 /app/lib/bazaar-client/Bazaar.Client.Linux /app/bin/bazaar-client
      - install -Dm644 packaging/linux-flatpak/TheBazaarAuthors.BazaarClient.desktop /app/share/applications/TheBazaarAuthors.BazaarClient.desktop
      - install -Dm644 packaging/linux-flatpak/TheBazaarAuthors.BazaarClient.metainfo.xml /app/share/metainfo/TheBazaarAuthors.BazaarClient.metainfo.xml
      # TODO: install the application icon (512x512 PNG or SVG) to
      # /app/share/icons/hicolor/<size>/apps/TheBazaarAuthors.BazaarClient.png. No icon asset exists yet.
    sources:
      # Local source tree. Replace with a `type: git` source pinned to a commit before any Flathub submission.
      - type: dir
        path: ../..
        skip:
          - .git
          - .claude
          - .github
          - tests
          - docs
          - spikes
      # Offline NuGet packages. Generated by flatpak-dotnet-generator from the repo's
      # packages lock (see generated-sources.json). Currently an empty placeholder.
      - generated-sources.json
