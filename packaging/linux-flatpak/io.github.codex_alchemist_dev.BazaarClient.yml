# Flatpak manifest for the Bazaar Linux desktop client (Bazaar.Client.Linux).
#
# Status: SPIKE (doc 30, section 3 and work package 9). Not for Flathub submission.
#
# This manifest compiles nothing. It installs the already-built, reproducible self-contained tarball made by
# packaging/linux/build-tarball.sh, so no .NET SDK extension is needed (there is none for .NET 11).
# It is a TEMPLATE: build-flatpak.sh stages the tarball, the .desktop, the metainfo and the icon into a scratch
# directory beside a rendered copy in which @TARBALL@ is the staged tarball name and @SHA256@ its checksum.
# Do not run flatpak-builder on this file directly.
#
# Build (on a machine with flatpak, flatpak-builder, org.freedesktop.Platform and org.freedesktop.Sdk installed):
#   packaging/linux-flatpak/build-flatpak.sh [--arch x86_64|aarch64] [output-dir]
#   flatpak install --user out/flatpak/io.github.codex_alchemist_dev.BazaarClient.flatpak
#   flatpak run io.github.codex_alchemist_dev.BazaarClient

app-id: io.github.codex_alchemist_dev.BazaarClient
runtime: org.freedesktop.Platform
runtime-version: '25.08'        # Must equal FREEDESKTOP_BRANCH in .github/workflows/linux-package-flatpak.yml
sdk: org.freedesktop.Sdk
command: bazaar-client

finish-args:
  # Every entry below is a sandbox hole and is listed on purpose (doc 30 section 3: "Terminal reach into
  # the host needs sandbox holes"). test-flatpak-metadata.sh fails on any entry not in this reviewed set.
  # Hole 1, Wayland display: primary window system (Avalonia supports both; doc 30 section 1).
  - --socket=wayland
  # Hole 2, X11 display: used only when Wayland is absent (fallback-x11).
  - --socket=fallback-x11
  # Hole 3, ipc sharing: X11 shared memory, needed by Avalonia on X11.
  - --share=ipc
  # Hole 4, GPU access (dri): hardware rendering.
  - --device=dri
  # Hole 5, network: the client talks to the Bazaar server over the network.
  - --share=network
  # No filesystem, session bus, or host-process access by default.
  # The local terminal (doc 30 section 2) runs a shell inside the sandbox only.
  # Any host reach for the terminal is an open decision and must be added deliberately.

modules:
  - name: bazaar-client
    buildsystem: simple
    build-commands:
      # The tarball is self-contained: it carries its own .NET runtime (doc 30: self-contained builds).
      - mkdir -p /app/lib/bazaar-client
      - cp -a bazaar-client-tarball/. /app/lib/bazaar-client/
      - chmod 755 /app/lib/bazaar-client/Bazaar.Client.Linux
      - install -Dm755 bazaar-client-launcher.sh /app/bin/bazaar-client
      - install -Dm644 io.github.codex_alchemist_dev.BazaarClient.desktop /app/share/applications/io.github.codex_alchemist_dev.BazaarClient.desktop
      - install -Dm644 io.github.codex_alchemist_dev.BazaarClient.metainfo.xml /app/share/metainfo/io.github.codex_alchemist_dev.BazaarClient.metainfo.xml
      # Application icon: scalable SVG named after the app-id (placeholder artwork, shared with the AppImage;
      # build-flatpak.sh stages packaging/linux-appimage/bazaar-client.svg here).
      - install -Dm644 bazaar-client.svg /app/share/icons/hicolor/scalable/apps/io.github.codex_alchemist_dev.BazaarClient.svg
    sources:
      # The reproducible tarball from packaging/linux/build-tarball.sh. Its single top-level directory is stripped.
      - type: archive
        path: '@TARBALL@'
        sha256: '@SHA256@'
        strip-components: 1
        dest: bazaar-client-tarball
      - type: script
        dest-filename: bazaar-client-launcher.sh
        commands:
          - exec /app/lib/bazaar-client/Bazaar.Client.Linux "$@"
      - type: file
        path: io.github.codex_alchemist_dev.BazaarClient.desktop
      - type: file
        path: io.github.codex_alchemist_dev.BazaarClient.metainfo.xml
      - type: file
        path: bazaar-client.svg
