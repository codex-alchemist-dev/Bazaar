# Bazaar server stack: PostgreSQL 18 with pgvector, a one-shot schema migration, and Bazaar.Server.Host (doc 37 OCI row, doc 03, doc 04).
#
# Before the first start, create the two secret files below (they are not committed; see secrets/.gitignore):
#   secrets/postgres_password            the PostgreSQL password, one line
#   secrets/bazaar_db_connection         the Npgsql connection string, with the same password, for example:
#                                        Host=postgres;Port=5432;Database=bazaar;Username=bazaar;Password=<same password>
#
# Run from this directory:  docker compose up -d --build
# Then:                     docker compose ps
#
# Network: nothing is published to the host. The status and wire listener in Bazaar.Server.Host binds to
# loopback inside the container (doc 03 floor), so it is not reachable from other containers or the host.
# Exposing it needs the owner-approved non-loopback bind, which is not wired yet.

name: bazaar

x-server-build: &server-build
  context: ../..
  dockerfile: packaging/oci/Dockerfile
  args:
    SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:11.0
    RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:11.0

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: bazaar
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (version subdirectory inside the volume).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d bazaar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  # One-shot: applies pending migrations under the instance lock, then exits (doc 03, C44).
  migrate:
    build: *server-build
    image: bazaar-server:local
    pull_policy: build
    restart: "no"
    command: ["migrate"]
    # The migrate subcommand reads configuration with a BAZAAR__ prefix (MigrateSubcommand.cs), so its
    # variables carry that prefix. The server service below reads them unprefixed.
    environment:
      BAZAAR__Bazaar__Host__DataRoot: /var/lib/bazaar
      BAZAAR__Bazaar__Host__DatabaseConnectionReference: file:/run/secrets/bazaar_db_connection
    secrets:
      - bazaar_db_connection
    volumes:
      - serverdata:/var/lib/bazaar
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  server:
    build: *server-build
    image: bazaar-server:local
    pull_policy: build
    restart: unless-stopped
    environment:
      Bazaar__Host__DataRoot: /var/lib/bazaar
      Bazaar__Host__DatabaseConnectionReference: file:/run/secrets/bazaar_db_connection
    secrets:
      - bazaar_db_connection
    volumes:
      - serverdata:/var/lib/bazaar
    # Hardening: no privilege gain, read-only root filesystem with writable data root and /tmp only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image runs as UID 1654 (non-root). The health check runs inside the container on loopback.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7390 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  bazaar_db_connection:
    file: ./secrets/bazaar_db_connection

volumes:
  pgdata:
  serverdata:

networks:
  backend:
    driver: bridge
