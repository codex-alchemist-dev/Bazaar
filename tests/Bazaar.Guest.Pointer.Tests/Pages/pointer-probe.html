<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pointer-probe</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* The whole window is one solid colour that encodes the latest event; pointer-events none lets events reach the page. */
  #overlay { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; background: rgb(30, 60, 90); }
</style>
</head>
<body>
<div id="overlay"></div>
<script>
  // The window is read as a 16 by 9 grid of 80 pixel cells (1280x720). Red carries the cell of a mousedown (0 to 143), or 200 plus
  // the horizontal direction for a wheel event; green carries the button (20 left, 120 middle, 220 right) or the vertical wheel
  // direction (20 up, 120 none, 220 down); blue changes with every event so a reader can tell a new event from an old one.
  var seq = 0;
  var overlay = document.getElementById('overlay');
  function paint(r, g, label) {
    seq += 1;
    overlay.style.background = 'rgb(' + r + ', ' + g + ', ' + ((seq * 5 + 5) % 250) + ')';
    document.title = label;
  }
  window.addEventListener('mousedown', function (e) {
    var cell = Math.floor(e.clientX / 80) + 16 * Math.floor(e.clientY / 80);
    paint(cell, 20 + e.button * 100, 'down ' + e.clientX + ',' + e.clientY + ' b' + e.button);
  }, true);
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    var h = e.deltaX > 0 ? 1 : (e.deltaX < 0 ? 2 : 0);
    var v = e.deltaY > 0 ? 220 : (e.deltaY < 0 ? 20 : 120);
    paint(200 + h, v, 'wheel ' + e.deltaX + ',' + e.deltaY);
  }, { capture: true, passive: false });
</script>
</body>
</html>
