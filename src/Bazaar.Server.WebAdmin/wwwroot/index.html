<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bazaar admin panel</title>
  <link rel="stylesheet" href="/admin/assets/panel.css">
  <script src="/admin/assets/panel.js" defer></script>
</head>
<body>
  <header class="top">
    <h1 id="server-name" class="brand">Bazaar server</h1>
    <div id="account-bar" class="account-bar" hidden>
      <button type="button" id="signout" class="button secondary">Sign out</button>
    </div>
  </header>

  <main id="signed-out" class="shell">
    <section class="card" aria-labelledby="signin-heading">
      <h2 id="signin-heading" class="visually-hidden">Sign in</h2>
      <p>
        <a id="signin-link" class="button primary" href="/signin?audience=admin">Sign in with passkey</a>
      </p>
      <p id="signed-out-note" class="notice" role="status"></p>
    </section>
  </main>

  <main id="app" class="shell" hidden>
    <div id="tabs" class="tabs" role="tablist" aria-label="Admin sections"></div>
    <div id="panels"></div>
  </main>

  <div id="announce" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
